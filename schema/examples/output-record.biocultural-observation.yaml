# Example OutputRecord: a field-signing sensor emitting a biocultural observation
# where the claim-maker is a COMMUNITY and data sovereignty is non-negotiable.
# Demonstrates the differentiators the contract exists for: COMMUNITY consenter,
# SOVEREIGN tier, rawDataStaysAtSource=true (only the fingerprint travels), yet
# onChainAnchorAllowed=true (the fingerprint may anchor while raw never leaves).
name: "Riparian restoration — spring 2026 monitoring"
rid: "orn:regen.output-record:field-signing-sensor/fieldsign-obs-2026-05-18-0421"
sourceRecordId: "fieldsign:obs:2026-05-18:0421"
sensorId: "field-signing-sensor"
sensorVersion: "0.1.0"
sourceSystem: "field_signing_app"
recordType: "biocultural_observation"
emittedAt: "2026-05-19T02:00:00Z"
observedAt: "2026-05-18T09:30:00-07:00"
# No observedLocalDate field: the source-local date is derived as
# `observedAt converted to sourceTimezone` (= 2026-05-18), so storing it
# separately would only create something that can disagree with its own instant.
sourceTimezone: "America/Vancouver"
processingState: COMPLETE
language:
  - "en"
# The snapshot is what the community agreed to on 2026-05-18. It is evidence and
# never changes. consentRef points at the living record the community controls —
# if they later revoke, or drop the tier, or withdraw anchoring permission, the
# resolved policy says so and the more restrictive value wins. A consumer that
# cannot reach the ref must not act on the snapshot's permissions.
consentAtEmission:
  consentStatus: GRANTED
  dataSovereigntyTier: SOVEREIGN
  rawDataStaysAtSource: true
  onChainAnchorAllowed: true
  consentedBy:
    name: "W̱SÁNEĆ Leadership Council"
    type: COMMUNITY
  consentDate: "2026-05-18"
  retentionPolicy: "raw imagery and coordinates remain at source; governed by the consenting community"
  consentEvidence:
    - "https://example.org/consent/wsanec-2026-05.json"
consentRef: "orn:regen.consent:wsanec-riparian-monitoring/v1"
rawContentHash: "b2s256:9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d"
recordContentHash: "b2s256:00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
speakers: []
# The extracted Claim is REFERENCED, not embedded. It has its own identity and
# lifecycle — verificationStatus moves from SELF_REPORTED onward, contentHash and
# dataIri are minted at anchor time, and supersession rewrites it — none of which
# should re-version this evidence envelope. The claims engine resolves the RID.
claimRefs:
  - "orn:regen.claim:wsanec-riparian-2026-05-18-001"
