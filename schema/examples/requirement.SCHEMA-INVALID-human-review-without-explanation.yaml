# expect: is not valid under any of the given schemas in /requirementCheck
# class: GenericRequirement
# shacl: not enforced
# A check that can send a requirement to a person says why. This is a LinkML
# rule, which the generated JSON Schema enforces and the generated SHACL does
# not express.
# requirementCheck is optional, so its JSON Schema allows either the check or
# null, and an error inside it is reported as matching neither.
identifier: EXAMPLE-REGISTRATION-CP-1
requirementStatement: >-
  A site's crediting term is ten years, with an option to renew.
assessmentScope: >-
  Checks only the length of the crediting period a C06SiteClaim states.
requirementCheck:
  queryLanguage: rfs:Sparql11Sep0002
  evidenceAvailableQuery: ASK { GRAPH ?_claim_iri { ?_claim_iri ?p ?o } }
  needsHumanReviewQuery: ASK { GRAPH ?_claim_iri { ?_claim_iri ?p ?o } }
  satisfiedQuery: ASK { GRAPH ?_claim_iri { ?_claim_iri ?p ?o } }
  missingEvidenceExplanation: The Claim has no content.
  satisfiedExplanation: The Claim has content.
  unmetExplanation: The Claim has no matching content.
