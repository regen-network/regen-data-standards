# Example OutputRecord: an Otter transcript sensor emitting one meeting record.
# Demonstrates the raw-evidence emission shape from field-notes §1–§7:
# identity on the source id, participants (claimed) vs speakers (observed),
# COMPLETE processing state, and a KNOWLEDGE_COMMONS consent snapshot plus a ref
# to the current consent record.
# claimRefs: [] is the natural state — claim extraction is a separate downstream
# pass (field-notes §6), so a raw transcript emission carries evidence, not
# yet claims.
name: "Regen AI Builders Standup"
# rid = this record's own identity (what a uriorcurie ref to it resolves against).
# Distinct from the (sourceRecordId, sensorId) dedup key below.
rid: "orn:regen.output-record:otter-transcript-sensor/26J6RZXDFBVYAODN"
sourceRecordId: "26J6RZXDFBVYAODN"
sensorId: "otter-transcript-sensor"
sensorVersion: "0.1.0"
sourceSystem: "otter"
recordType: "meeting_transcript"
emittedAt: "2026-07-15T05:10:00Z"
observedAt: "2026-07-14T18:20:00-07:00"
sourceTimezone: "America/Los_Angeles"
processingState: COMPLETE
language:
  - "en"
# Consent is carried twice on purpose: an immutable snapshot of what was true at
# emission, and a ref to the current versioned policy. A consumer applies the more
# restrictive of the two, field by field, and denies if the ref won't resolve.
consentAtEmission:
  consentStatus: GRANTED
  dataSovereigntyTier: KNOWLEDGE_COMMONS
  rawDataStaysAtSource: false
  onChainAnchorAllowed: true
  retentionPolicy: "retain fingerprint indefinitely; raw per commons norms"
consentRef: "orn:regen.consent:regen-ai-builders-standup/v3"
