# NEGATIVE FIXTURE — this record is INVALID by contract but VALID by LinkML.
#
# It sets consent.rawDataStaysAtSource: true (SOVEREIGN tier) and then carries the
# raw payload inline anyway. That is precisely what the contract exists to prevent,
# and `linkml-validate` will NOT catch it: a LinkML rule cannot traverse from
# OutputRecord into consent.rawDataStaysAtSource, so the constraint has no schema
# expression. The only rule on the class requires rawContentHash when
# processingState is COMPLETE.
#
# It is committed deliberately, so that:
#   1. the gap is visible to anyone reading the examples rather than buried in a
#      review thread, and
#   2. if a future LinkML version (or a SHACL shape) ever does express this, the
#      fixture starts failing and we find out.
#
# If you are implementing a consumer: validating this record successfully does not
# mean you may read rawContentInline. Enforce residency yourself.
#
# See docs/output-record-contract.md, "Raw-data residency is not schema-enforced".

