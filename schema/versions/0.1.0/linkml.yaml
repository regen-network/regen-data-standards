    slot_usage:
      name:
        name: name
        description: Human-readable name of the subject.
    attributes:
      id:
        name: id
        description: IRI or CURIE of the subject, for example https://example.org/plot/A.
        from_schema: https://framework.regen.network/schema/ClaimSubject
        identifier: true
        owner: ClaimSubject
        domain_of:
        - ClaimSubject
        - Evidence
        range: uriorcurie
        required: true
      name:
        name: name
        description: Human-readable name of the subject.
        from_schema: https://framework.regen.network/schema/
        rank: 1
