        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:issuerRole
        owner: RegistryReportEvaluation
        domain_of:
        - RegistryReviewEvaluation
        range: IssuerRole
        required: true
      conditions:
        name: conditions
        description: Obligations the judgment carries to a later milestone, such as
          follow-up actions due before verification. Unordered set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:conditions
        list_elements_ordered: false
        owner: RegistryReportEvaluation
        domain_of:
        - RegistryReviewEvaluation
        range: Condition
        multivalued: true
        inlined: true
        inlined_as_list: true
      hasTarget:
        name: hasTarget
        description: The exact resource or resources directly examined or assessed
          in reaching the Evaluation's conclusion. When a resource can change, the
          target identifies the particular version or snapshot that was assessed.
          It is distinct from the Evaluation's focal subject (hasSubject) and from
          the criteria it applies (appliesRequirement).
        comments:
        - 'Implementation: each value is an IRI, never a logical identifier or label.
          Repeatable and unordered. The base slot does not restrict what kind of resource
          a target is; a kind of evaluation may require it or restrict it, as EvidenceSupportEvaluation
          does to Evidence records and ClaimConsistencyEvaluation to claim versions.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasTarget
        list_elements_ordered: false
        owner: RegistryReportEvaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      reliesOn:
        name: reliesOn
        description: An exact Claim or Evaluation whose asserted content or result
          is used in reaching this Evaluation's assessment, but which is not itself
          directly assessed by the Evaluation, for example the claim stating an enrolment
          cutoff that a confirmation relies on.
        comments:
        - 'Implementation: each value is the IRI of one immutable version, such as
          a ClaimIRI. Repeatable and unordered. Specializes dcterms:references, so
          it asserts neither derivation nor support.'
        from_schema: https://framework.regen.network/schema/
        is_a: references
        slot_uri: rfs:reliesOn
        list_elements_ordered: false
        owner: RegistryReportEvaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      appliesRequirement:
        name: appliesRequirement
        description: 'Exact requirement versions an evaluation applies or judges,
          whether or not the claimant named them. Each identifier names one immutable
          requirement version within an exact requirement-set version, such as a checklist
          version: the same short ID can name different requirements in different
          versions. The requirement and requirement-set records themselves are defined
          by WP5-01 (claims#30). Unordered set.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:appliesRequirement
        list_elements_ordered: false
        owner: RegistryReportEvaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      appliesRequirementSet:
        name: appliesRequirementSet
        description: 'Exact versions of requirement sets, such as a registration or
          validation checklist version, that an evaluation applies or assesses as
          a whole. An evaluation of one requirement names only that requirement (appliesRequirement):
          its set is reached through the requirement''s membership, defined by WP5-01
          (claims#30).'
        comments:
        - 'Implementation: each value is the IRI of one requirement-set version. Repeatable
          and unordered.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:appliesRequirementSet
        list_elements_ordered: false
        owner: RegistryReportEvaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      governedBy:
        name: governedBy
        description: Exact versions of the governing documents a claim or evaluation
          is made under, such as a credit class, a methodology or a program guide
          version. A governing document is broader than a set of requirements, which
          is named with appliesRequirementSet. It is content and enters the identity
          of the record, and is distinct from a schema-version declaration, which
          states which schema the RDF conforms to.
        comments:
        - 'Implementation: each value is the IRI of one exact document version. Repeatable
          and unordered.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:governedBy
        list_elements_ordered: false
        owner: RegistryReportEvaluation
        domain_of:
        - Evaluation
        - C06ProjectClaim
        range: uriorcurie
        multivalued: true
      rationale:
        name: rationale
        description: Why the issuer reached the result.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:rationale
        owner: RegistryReportEvaluation
        domain_of:
        - Evaluation
        range: string
      evaluationMethod:
        name: evaluationMethod
        description: 'The procedures the reviewer used. Required on a Registry review:
          every review states how it was carried out.'
        comments:
        - 'Implementation: each value is the IRI of a method, so a method is defined
          once and reused, and another program can use its own terms. EvaluationMethodType
          lists the recommended shared methods by their meaning IRIs. Repeatable and
          unordered.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:evaluationMethod
        list_elements_ordered: false
        owner: RegistryReportEvaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        required: true
        multivalued: true
        minimum_cardinality: 1
      evaluationMethodDescription:
        name: evaluationMethodDescription
        description: How the evaluator reached the assessment, in their words, for
          example which records were compared and how.
        comments:
        - 'Implementation: must contain a non-whitespace character, so an empty description
          is rejected rather than standing in for none.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:evaluationMethodDescription
        owner: RegistryReportEvaluation
        domain_of:
        - Evaluation
        range: string
        pattern: \S
      hasResult:
        name: hasResult
        description: The conclusion of the Evaluation, as a result whose type depends
          on the kind of evaluation.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasResult
        owner: RegistryReportEvaluation
        domain_of:
        - Evaluation
        range: VerificationOpinionResult
        required: true
        inlined: true
      name:
        name: name
        description: Optional human-readable title of the claim, for display. It is
          not the assertion, which is claimStatement.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:name
        owner: RegistryReportEvaluation
        domain_of:
        - Link
        - ProjectInfo
        - Feature
        - File
        - Impact
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - BufferPoolAccount
        - CreditClassInfo
        - Claim
        - Evidence
        - Activity
        - Entity
        range: string
      claimStatement:
        name: claimStatement
        description: 'The assertion, as the claimants state it in natural language.
          It is asserted content, not a presentational summary: changing it changes
          the Claim. A claim type may also formalize the assertion, or add detail
          to it, in structured fields; the statement and those fields are one assertion
          and must agree. When they disagree, neither overrides the other: the Claim
          is internally inconsistent and is corrected by a new version before its
          evidence is evaluated. Specializes schema:description.'
        from_schema: https://framework.regen.network/schema/
        is_a: description
        slot_uri: rfs:claimStatement
        owner: RegistryReportEvaluation
        domain_of:
        - Claim
        range: string
        required: true
      inLanguage:
        name: inLanguage
        description: Language of claimStatement, as a BCP 47 tag with a 2- or 3-letter
          ISO 639 primary language subtag, such as en or cs. It says nothing about
          the language of the cited sources, which they record themselves, or about
          how a statement translated from a source was derived.
        from_schema: https://framework.regen.network/schema/
        slot_uri: schema:inLanguage
        owner: RegistryReportEvaluation
        domain_of:
        - Claim
        - Evidence
        range: string
        pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$
      url:
        name: url
        description: Link to a page with more information about the claim. A pointer
          for readers, not evidence; cite evidence with hasEvidenceCitation.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:url
        owner: RegistryReportEvaluation
        domain_of:
        - Link
        - ProjectInfo
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - CreditClassInfo
        - Claim
        - Entity
        range: uri
      assertedBy:
        name: assertedBy
        description: 'The issuer: the party that makes the judgment and takes responsibility
          for it.'
        from_schema: https://framework.regen.network/schema/
        is_a: wasAttributedTo
        slot_uri: rfs:assertedBy
        list_elements_ordered: false
        owner: RegistryReportEvaluation
        domain_of:
        - Claim
        range: Entity
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      assertedAt:
        name: assertedAt
        description: When the issuer made the judgment.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:assertedAt
        owner: RegistryReportEvaluation
        domain_of:
        - Claim
        range: datetime
        required: true
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+00:00$
      hasSubject:
        name: hasSubject
        description: The focal subject considered by the Evaluation, such as a project,
          plot, organization, activity, dataset or other resource.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasSubject
        owner: RegistryReportEvaluation
        domain_of:
        - Claim
        range: ClaimSubject
        required: true
        inlined: true
      hasEvidenceCitation:
        name: hasEvidenceCitation
        description: Evidence the issuer relied on, as citations.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasEvidenceCitation
        list_elements_ordered: false
        owner: RegistryReportEvaluation
        domain_of:
        - Claim
        range: EvidenceCitation
        multivalued: true
        inlined: true
        inlined_as_list: true
      wasRevisionOf:
        name: wasRevisionOf
        description: 'Identifier of the exact, immutable earlier Claim version that
          this Claim revises: its ClaimIRI. A Claim has no identifier slot, because
          its ClaimIRI is computed over its canonical form outside Claim content (regen-network/claims#1),
          so the value is a bare IRI and the slot names no class. It never names a
          logical claim or version family. In PROV a revision implies that both versions
          are aspects of the same thing (alternateOf), so use it only for a revised
          version of the same assertion; a separate, later assertion, such as a follow-up
          observation, is a new Claim and is not a revision. The earlier version is
          unchanged, its evaluations do not carry over, and selecting a current version
          happens outside the Claim.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: prov:wasRevisionOf
        owner: RegistryReportEvaluation
        domain_of:
        - Claim
        range: uriorcurie
    class_uri: rfs:RegistryReportEvaluation
