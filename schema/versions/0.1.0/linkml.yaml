  ClaimConsistencyEvaluation:
    name: ClaimConsistencyEvaluation
    description: Whether a claim's statement and its structured fields express the
      same assertion. The generated validators check structure only; they cannot compare
      prose with values, so a reviewer records the result on the exact claim version.
      An internally inconsistent claim is corrected by a new version before its evidence
      is evaluated; neither the statement nor the fields override the other.
    from_schema: https://framework.regen.network/schema/
    is_a: Evaluation
    slot_usage:
      hasTarget:
        name: hasTarget
        description: The exact claim versions whose statement and fields are compared.
          Unordered set.
        required: true
        minimum_cardinality: 1
      hasResult:
        name: hasResult
        range: ClaimConsistencyResult
        required: true
      rationale:
        name: rationale
        description: Where the statement and the fields agree or disagree, for example
          "the statement gives 12 ha, the area field 15 ha".
        required: true
