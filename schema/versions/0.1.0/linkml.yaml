  ClaimSubject:
    name: ClaimSubject
    description: 'What a Claim is about: a place, plot, project, organization, community,
      indicator, dataset or another claim, identified by an IRI so that claims about
      the same subject can be joined. The IRI identifies the subject itself; its full
      description lives on its own resource.'
