  ClaimSubject:
    name: ClaimSubject
    description: 'What a Claim is about: a place, plot, project, organization, community,
      indicator, dataset or another claim, identified by an IRI so that claims about
      the same subject can be joined. In a Claim the node carries only the subject''s
      IRI and its type, the class a claim type''s hasSubject range names, so that
      the range can be checked in one document. Its name and full description live
      on its own resource, not in each Claim about it: otherwise every Claim would
      state its own name for the subject, and the names would merge on the subject''s
      IRI.'
    from_schema: https://framework.regen.network/schema/
    attributes:
      id:
        name: id
        description: IRI or CURIE of the subject, for example https://example.org/plot/A.
        from_schema: https://framework.regen.network/schema/ClaimSubject
        identifier: true
        owner: ClaimSubject
        domain_of:
        - ClaimSubject
        - Evidence
        - Activity
        range: uriorcurie
        required: true
    class_uri: rfs:ClaimSubject
  Evidence:
    name: Evidence
    description: 'A source cited as evidence: a document, dataset, record or observation,
      identified by the IRI of the exact version cited. The IRI identifies the whole
      source, never a position inside it: positions are on the citation, so the same
      source cited at several places stays one resource with one hash. A record is
      its own document, which claims and evaluations reference by IRI. Whether it
      actually supports a claim is judged separately, by evaluations, and its current
      availability or access is not recorded here.'
    from_schema: https://framework.regen.network/schema/
    mixins:
    - ProvEntity
    slots:
    - name
    - description
    - sourceType
    - mediaType
    - inLanguage
    - contentHash
    - resolver
    - licence
    - issued
    - wasGeneratedBy
    slot_usage:
      name:
        name: name
        description: Title of the cited source.
      description:
        name: description
        description: What the source is. The record is shared by every claim that
          cites the source, so it describes the source itself, not one citer's use
          of it; where a claim relies on it goes on the citation.
      inLanguage:
        name: inLanguage
        description: Language of the source's text, as a BCP 47 tag with a 2- or 3-letter
          ISO 639 primary language subtag, such as cs. It is recorded separately from
          the language of the claims that cite the source, which may be written in
          another language; it says nothing about how a claim's statement was derived
          from the source.
    attributes:
      id:
        name: id
        description: IRI or CURIE of the exact source version cited, without a fragment,
          for example https://example.org/project-plan-v2.pdf. A position inside the
          source, such as a page, is a selector on the citation.
        from_schema: https://framework.regen.network/schema/Evidence
        identifier: true
        owner: Evidence
        domain_of:
        - ClaimSubject
        - Evidence
        - Activity
        range: uriorcurie
        required: true
        pattern: ^[^#]*$
      name:
        name: name
        description: Title of the cited source.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:name
        owner: Evidence
        domain_of:
        - Link
        - ProjectInfo
        - Feature
        - File
        - Impact
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - BufferPoolAccount
        - CreditClassInfo
        - Claim
        - Evidence
        - Activity
        - Entity
        range: string
      description:
        name: description
        description: What the source is. The record is shared by every claim that
          cites the source, so it describes the source itself, not one citer's use
          of it; where a claim relies on it goes on the citation.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:description
        owner: Evidence
        domain_of:
        - Link
        - ProjectInfo
        - File
        - CreditClassInfo
        - Evidence
        - Activity
        - Condition
        - Entity
        range: string
      sourceType:
        name: sourceType
        description: Genre of the cited source, from the DCMI Type Vocabulary, which
          the dcterms:type definition recommends. Finer kinds of evidence that a program
          accepts, such as a lease agreement, belong to that program's requirements,
          not to Evidence.
        from_schema: https://framework.regen.network/schema/
        slot_uri: dcterms:type
        owner: Evidence
        domain_of:
        - Evidence
        range: DCMIType
        required: true
      mediaType:
        name: mediaType
        description: Media type of the source, for example application/pdf.
        from_schema: https://framework.regen.network/schema/
        slot_uri: dcterms:format
        owner: Evidence
        domain_of:
        - Evidence
        range: string
      inLanguage:
        name: inLanguage
        description: Language of the source's text, as a BCP 47 tag with a 2- or 3-letter
          ISO 639 primary language subtag, such as cs. It is recorded separately from
          the language of the claims that cite the source, which may be written in
          another language; it says nothing about how a claim's statement was derived
          from the source.
        from_schema: https://framework.regen.network/schema/
        slot_uri: schema:inLanguage
        owner: Evidence
        domain_of:
        - Claim
        - Evidence
        range: string
        pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$
      contentHash:
        name: contentHash
        description: Hash of the bytes of the cited source version. This is the hash
          of the source, which a citation needs; it is not the hash of the Claim or
          Evaluation that cites it, which is never part of its own content.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:contentHash
        owner: Evidence
        domain_of:
        - Evidence
        range: ContentDigest
        required: true
        inlined: true
      resolver:
        name: resolver
        description: Where the bytes of the cited version can be fetched. The data
          can stay where its owner keeps it; the claim stores only the hash and the
          resolver. Unordered set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:resolver
        list_elements_ordered: false
        owner: Evidence
        domain_of:
        - Evidence
        range: uri
        required: true
        multivalued: true
        minimum_cardinality: 1
      licence:
        name: licence
        description: IRI of the licence document or versioned licence terms in effect
          for this version of the source. When absent, the terms must be read as "unspecified
          — all rights reserved" (rfs:UnspecifiedAllRightsReserved), never as unrestricted.
        from_schema: https://framework.regen.network/schema/
        slot_uri: dcterms:license
        owner: Evidence
        domain_of:
        - Evidence
        range: uri
      issued:
        name: issued
        description: Date of the cited version of the source.
        from_schema: https://framework.regen.network/schema/
        slot_uri: dcterms:issued
        owner: Evidence
        domain_of:
        - Evidence
        range: date
      wasGeneratedBy:
        name: wasGeneratedBy
        description: 'The activity that produced the cited source, with its period
          and who carried it out: for example the soil sampling behind a results file,
          or the field operations a farm management record documents. When the evidence
          was produced is the activity''s period, not a field of Evidence, because
          PROV-O declares activities and entities disjoint. Evidence produced by the
          same activity names the same activity IRI.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: prov:wasGeneratedBy
        owner: Evidence
        domain_of:
        - Evidence
        range: Activity
        inlined: true
    class_uri: rfs:Evidence
  EvidenceCitation:
    name: EvidenceCitation
    description: 'One piece of evidence a claim cites: a local profile of a Web Annotation
      resource selection, with exactly one source, the Evidence record, and zero or
      more selectors that locate the cited material inside it. Without a selector
      the whole source is cited. Several selectors are alternative ways to locate
      the same passage; distinct passages of one source are separate citations. Changing
      a selector changes the citation, and so the citing record''s content, but never
      the source''s IRI or hash.'
    from_schema: https://framework.regen.network/schema/
    broad_mappings:
    - oa:ResourceSelection
    slots:
    - source
    - selector
    slot_usage:
      source:
        name: source
        required: true
    attributes:
      source:
        name: source
        description: 'The cited source: the IRI of an Evidence record.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: oa:hasSource
        owner: EvidenceCitation
        domain_of:
        - EvidenceCitation
        range: Evidence
        required: true
        inlined: false
      selector:
        name: selector
        description: How to locate the cited segment of the source. Several selectors
          are alternatives that locate the same segment. Unordered set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: oa:hasSelector
        list_elements_ordered: false
        owner: EvidenceCitation
        domain_of:
        - EvidenceCitation
        range: Selector
        multivalued: true
        inlined: true
        inlined_as_list: true
        any_of:
        - range: FragmentSelector
        - range: TextQuoteSelector
    class_uri: rfs:EvidenceCitation
  Selector:
    name: Selector
    description: 'Web Annotation selector: how to locate a segment of the source.
      Its kind is stated with selectorType.'
    from_schema: https://framework.regen.network/schema/
    abstract: true
    slots:
    - selectorType
    - refinedBy
    attributes:
      selectorType:
        name: selectorType
        description: 'The kind of selector, as a CURIE: oa:FragmentSelector or oa:TextQuoteSelector.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rdf:type
        designates_type: true
        owner: Selector
        domain_of:
        - Selector
        range: uriorcurie
        required: true
      refinedBy:
        name: refinedBy
        description: A selector applied to the segment this one selects, for example
          a quotation within a page. Several are alternatives with the same result.
          Unordered set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: oa:refinedBy
        list_elements_ordered: false
        owner: Selector
        domain_of:
        - Selector
        range: Selector
        multivalued: true
        inlined: true
        inlined_as_list: true
        any_of:
        - range: FragmentSelector
        - range: TextQuoteSelector
    class_uri: oa:Selector
  FragmentSelector:
    name: FragmentSelector
    description: Locates a segment with a fragment identifier, such as page=16, in
      the syntax conformsTo names, for example RFC 3778 for PDF pages.
    from_schema: https://framework.regen.network/schema/
    is_a: Selector
    slots:
    - value
    - conformsTo
    slot_usage:
      value:
        name: value
        required: true
    attributes:
      value:
        name: value
        description: The fragment identifier, without the leading "#", such as page=16.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rdf:value
        owner: FragmentSelector
        domain_of:
        - FragmentSelector
        range: string
        required: true
      conformsTo:
        name: conformsTo
        description: The specification of the fragment syntax, for example http://tools.ietf.org/rfc/rfc3778
          for PDF or http://www.w3.org/TR/media-frags/ for audio and video.
        from_schema: https://framework.regen.network/schema/
        slot_uri: dcterms:conformsTo
        owner: FragmentSelector
        domain_of:
        - FragmentSelector
        range: uri
      selectorType:
        name: selectorType
        description: 'The kind of selector, as a CURIE: oa:FragmentSelector or oa:TextQuoteSelector.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rdf:type
        designates_type: true
        owner: FragmentSelector
        domain_of:
        - Selector
        range: uriorcurie
        required: true
      refinedBy:
        name: refinedBy
        description: A selector applied to the segment this one selects, for example
          a quotation within a page. Several are alternatives with the same result.
          Unordered set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: oa:refinedBy
        list_elements_ordered: false
        owner: FragmentSelector
        domain_of:
        - Selector
        range: Selector
        multivalued: true
        inlined: true
        inlined_as_list: true
        any_of:
        - range: FragmentSelector
        - range: TextQuoteSelector
    class_uri: oa:FragmentSelector
  TextQuoteSelector:
    name: TextQuoteSelector
    description: Locates a passage by quoting it exactly, with the text just before
      and after it to tell repeated passages apart. Used only when the quotation itself
      locates the passage; a display excerpt, translation or paraphrase is not a selector.
    from_schema: https://framework.regen.network/schema/
    is_a: Selector
    slots:
    - exact
    - prefix
    - suffix
    slot_usage:
      exact:
        name: exact
        required: true
    attributes:
      exact:
        name: exact
        description: The exact text of the passage.
        from_schema: https://framework.regen.network/schema/
        slot_uri: oa:exact
        owner: TextQuoteSelector
        domain_of:
        - TextQuoteSelector
        range: string
        required: true
      prefix:
        name: prefix
        description: Text immediately before the passage.
        from_schema: https://framework.regen.network/schema/
        slot_uri: oa:prefix
        owner: TextQuoteSelector
        domain_of:
        - TextQuoteSelector
        range: string
      suffix:
        name: suffix
        description: Text immediately after the passage.
        from_schema: https://framework.regen.network/schema/
        slot_uri: oa:suffix
        owner: TextQuoteSelector
        domain_of:
        - TextQuoteSelector
        range: string
      selectorType:
        name: selectorType
        description: 'The kind of selector, as a CURIE: oa:FragmentSelector or oa:TextQuoteSelector.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rdf:type
        designates_type: true
        owner: TextQuoteSelector
        domain_of:
        - Selector
        range: uriorcurie
        required: true
      refinedBy:
        name: refinedBy
        description: A selector applied to the segment this one selects, for example
          a quotation within a page. Several are alternatives with the same result.
          Unordered set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: oa:refinedBy
        list_elements_ordered: false
        owner: TextQuoteSelector
        domain_of:
        - Selector
        range: Selector
        multivalued: true
        inlined: true
        inlined_as_list: true
        any_of:
        - range: FragmentSelector
        - range: TextQuoteSelector
    class_uri: oa:TextQuoteSelector
  ContentDigest:
    name: ContentDigest
    description: 'A cryptographic hash of the bytes of the cited source version: the
      whole file, not a passage a citation selects. A reader recomputes it over the
      bytes the resolver returns to check that they are the bytes cited.'
    from_schema: https://framework.regen.network/schema/
    attributes:
      algorithm:
        name: algorithm
        from_schema: https://framework.regen.network/schema/Evidence
        slot_uri: rfs:algorithm
        owner: ContentDigest
        domain_of:
        - ContentDigest
        range: DigestAlgorithm
        required: true
      digestValue:
        name: digestValue
        description: Lowercase hexadecimal digest.
        from_schema: https://framework.regen.network/schema/Evidence
        slot_uri: rfs:digestValue
        owner: ContentDigest
        domain_of:
        - ContentDigest
        range: string
        required: true
        pattern: ^[0-9a-f]{64}$
    class_uri: rfs:ContentDigest
  Activity:
    name: Activity
    description: Something that took place over a period, identified by an IRI so
      that every piece of evidence it generated names the same activity. Its period
      is given as dates; prov:startedAtTime and prov:endedAtTime would require timestamps.
    from_schema: https://framework.regen.network/schema/
    mixins:
    - ProvActivity
    slots:
    - name
    - description
    - startDate
    - endDate
    - wasAssociatedWith
    attributes:
      id:
        name: id
        description: IRI of the activity.
        from_schema: https://framework.regen.network/schema/Activity
        identifier: true
        owner: Activity
        domain_of:
        - ClaimSubject
        - Evidence
        - Activity
        range: uriorcurie
        required: true
      name:
        name: name
        description: Name of the entity / resource.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:name
        owner: Activity
        domain_of:
        - Link
        - ProjectInfo
        - Feature
        - File
        - Impact
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - BufferPoolAccount
        - CreditClassInfo
        - Claim
        - Evidence
        - Activity
        - Entity
        range: string
      description:
        name: description
        description: Description of the entity / resource.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:description
        owner: Activity
        domain_of:
        - Link
        - ProjectInfo
        - File
        - CreditClassInfo
        - Evidence
        - Activity
        - Condition
        - Entity
        range: string
      startDate:
        name: startDate
        description: First day of the period, included.
        from_schema: https://framework.regen.network/schema/
        slot_uri: schema:startDate
        owner: Activity
        domain_of:
        - Activity
        - DatePeriod
        range: date
      endDate:
        name: endDate
        description: Last day of the period, included.
        from_schema: https://framework.regen.network/schema/
        slot_uri: schema:endDate
        owner: Activity
        domain_of:
        - Activity
        - DatePeriod
        range: date
      wasAssociatedWith:
        name: wasAssociatedWith
        description: 'Responsibility of an agent for an activity (PROV), for example
          the farm operator who carried out the field operations a record documents.
          Claim-type schemas that describe a domain activity, such as a restoration,
          name its operator the same way. Use it only on a class that represents an
          activity (its PROV domain is prov:Activity); such classes declare the ProvActivity
          mixin. It is not attribution of a Claim: the operator and the claimant may
          differ, and when they coincide both relations are still stated.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: prov:wasAssociatedWith
        list_elements_ordered: false
        owner: Activity
        domain_of:
        - Activity
        range: Entity
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: rfs:Activity
  ProvEntity:
    name: ProvEntity
    description: 'PROV-O Entity: a thing with some fixed aspects, such as a Claim
      version.'
    from_schema: https://framework.regen.network/schema/
    mixin: true
    class_uri: prov:Entity
  ProvAgent:
    name: ProvAgent
    description: 'PROV-O Agent: something that bears responsibility, such as a person,
      organization or community.'
    from_schema: https://framework.regen.network/schema/
    mixin: true
    class_uri: prov:Agent
  ProvActivity:
    name: ProvActivity
    description: 'PROV-O Activity: something that occurs over a period of time, such
      as the domain activity a specialized claim describes (a planting, a restoration)
      or the activity that produced a piece of evidence (a survey, a lab analysis).'
    from_schema: https://framework.regen.network/schema/
    mixin: true
    class_uri: prov:Activity
  Evaluation:
    name: Evaluation
    description: 'A Claim that records an assessment made by an agent about one focal
      subject. Its claimStatement states the assessment. As a Claim, an Evaluation
      identifies the agent responsible for it and when it was made. Depending on the
      kind of evaluation, it may also identify the resources it directly assessed,
      the criteria it applied, the evidence it relied on, the method it used and its
      result. It holds nothing that changes after it is made: a later assessment is
      a new Evaluation, and a correction is a new version linked through wasRevisionOf.'
    comments:
    - 'Implementation: abstract, like Claim, so its generated shape is open. It checks
      the base content of every kind of evaluation, including kinds another program
      defines, and lets a kind add fields. An evaluation that uses only the shared
      fields is a GenericEvaluation.'
    from_schema: https://framework.regen.network/schema/
    is_a: Claim
    abstract: true
    slots:
    - hasTarget
    - reliesOn
    - appliesRequirement
    - appliesRequirementSet
    - governedBy
    - rationale
    - evaluationMethod
    - evaluationMethodDescription
    - hasResult
    slot_usage:
      assertedBy:
        name: assertedBy
        description: 'The issuer: the party that makes the judgment and takes responsibility
          for it.'
      assertedAt:
        name: assertedAt
        description: When the issuer made the judgment.
      hasSubject:
        name: hasSubject
        description: The focal subject considered by the Evaluation, such as a project,
          plot, organization, activity, dataset or other resource.
      hasEvidenceCitation:
        name: hasEvidenceCitation
        description: Evidence the issuer relied on, as citations.
    attributes:
      hasTarget:
        name: hasTarget
        description: The exact resource or resources directly examined or assessed
          in reaching the Evaluation's conclusion. When a resource can change, the
          target identifies the particular version or snapshot that was assessed.
          It is distinct from the Evaluation's focal subject (hasSubject) and from
          the criteria it applies (appliesRequirement).
        comments:
        - 'Implementation: each value is an IRI, never a logical identifier or label.
          Repeatable and unordered. The base slot does not restrict what kind of resource
          a target is; a kind of evaluation may require it or restrict it, as EvidenceSupportEvaluation
          does to Evidence records and ClaimConsistencyEvaluation to claim versions.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasTarget
        list_elements_ordered: false
        owner: Evaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      reliesOn:
        name: reliesOn
        description: An exact Claim or Evaluation whose asserted content or result
          is used in reaching this Evaluation's assessment, but which is not itself
          directly assessed by the Evaluation, for example the claim stating an enrolment
          cutoff that a confirmation relies on.
        comments:
        - 'Implementation: each value is the IRI of one immutable version, such as
          a ClaimIRI. Repeatable and unordered. Specializes dcterms:references, so
          it asserts neither derivation nor support.'
        from_schema: https://framework.regen.network/schema/
        is_a: references
        slot_uri: rfs:reliesOn
        list_elements_ordered: false
        owner: Evaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      appliesRequirement:
        name: appliesRequirement
        description: 'Exact requirement versions an evaluation applies or judges,
          whether or not the claimant named them. Each identifier names one immutable
          requirement version within an exact requirement-set version, such as a checklist
          version: the same short ID can name different requirements in different
          versions. The requirement and requirement-set records themselves are defined
          by WP5-01 (claims#30). Unordered set.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:appliesRequirement
        list_elements_ordered: false
        owner: Evaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      appliesRequirementSet:
        name: appliesRequirementSet
        description: 'Exact versions of requirement sets, such as a registration or
          validation checklist version, that an evaluation applies or assesses as
          a whole. An evaluation of one requirement names only that requirement (appliesRequirement):
          its set is reached through the requirement''s membership, defined by WP5-01
          (claims#30).'
        comments:
        - 'Implementation: each value is the IRI of one requirement-set version. Repeatable
          and unordered.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:appliesRequirementSet
        list_elements_ordered: false
        owner: Evaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      governedBy:
        name: governedBy
        description: Exact versions of the governing documents a claim or evaluation
          is made under, such as a credit class, a methodology or a program guide
          version. A governing document is broader than a set of requirements, which
          is named with appliesRequirementSet. It is content and enters the identity
          of the record, and is distinct from a schema-version declaration, which
          states which schema the RDF conforms to.
        comments:
        - 'Implementation: each value is the IRI of one exact document version. Repeatable
          and unordered.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:governedBy
        list_elements_ordered: false
        owner: Evaluation
        domain_of:
        - Evaluation
        - C06ProjectClaim
        range: uriorcurie
        multivalued: true
      rationale:
        name: rationale
        description: Why the issuer reached the result.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:rationale
        owner: Evaluation
        domain_of:
        - Evaluation
        range: string
      evaluationMethod:
        name: evaluationMethod
        description: The procedures the evaluator used to reach the assessment, such
          as a document review or a site inspection. It is not who evaluated (that
          is assertedBy, and any role a program records) nor how the evidence was
          produced (that is the evidence's generating activity).
        comments:
        - 'Implementation: each value is the IRI of a method, so a method is defined
          once and reused, and another program can use its own terms. EvaluationMethodType
          lists the recommended shared methods by their meaning IRIs. Repeatable and
          unordered.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:evaluationMethod
        list_elements_ordered: false
        owner: Evaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      evaluationMethodDescription:
        name: evaluationMethodDescription
        description: How the evaluator reached the assessment, in their words, for
          example which records were compared and how.
        comments:
        - 'Implementation: must contain a non-whitespace character, so an empty description
          is rejected rather than standing in for none.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:evaluationMethodDescription
        owner: Evaluation
        domain_of:
        - Evaluation
        range: string
        pattern: \S
      hasResult:
        name: hasResult
        description: The conclusion of the Evaluation, as a result whose type depends
          on the kind of evaluation.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasResult
        owner: Evaluation
        domain_of:
        - Evaluation
        range: EvaluationResult
        inlined: true
      name:
        name: name
        description: Optional human-readable title of the claim, for display. It is
          not the assertion, which is claimStatement.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:name
        owner: Evaluation
        domain_of:
        - Link
        - ProjectInfo
        - Feature
        - File
        - Impact
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - BufferPoolAccount
        - CreditClassInfo
        - Claim
        - Evidence
        - Activity
        - Entity
        range: string
      claimStatement:
        name: claimStatement
        description: 'The assertion, as the claimants state it in natural language.
          It is asserted content, not a presentational summary: changing it changes
          the Claim. A claim type may also formalize the assertion, or add detail
          to it, in structured fields; the statement and those fields are one assertion
          and must agree. When they disagree, neither overrides the other: the Claim
          is internally inconsistent and is corrected by a new version before its
          evidence is evaluated. Specializes schema:description.'
        from_schema: https://framework.regen.network/schema/
        is_a: description
        slot_uri: rfs:claimStatement
        owner: Evaluation
        domain_of:
        - Claim
        range: string
        required: true
      inLanguage:
        name: inLanguage
        description: Language of claimStatement, as a BCP 47 tag with a 2- or 3-letter
          ISO 639 primary language subtag, such as en or cs. It says nothing about
          the language of the cited sources, which they record themselves, or about
          how a statement translated from a source was derived.
        from_schema: https://framework.regen.network/schema/
        slot_uri: schema:inLanguage
        owner: Evaluation
        domain_of:
        - Claim
        - Evidence
        range: string
        pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$
      url:
        name: url
        description: Link to a page with more information about the claim. A pointer
          for readers, not evidence; cite evidence with hasEvidenceCitation.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:url
        owner: Evaluation
        domain_of:
        - Link
        - ProjectInfo
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - CreditClassInfo
        - Claim
        - Entity
        range: uri
      assertedBy:
        name: assertedBy
        description: 'The issuer: the party that makes the judgment and takes responsibility
          for it.'
        from_schema: https://framework.regen.network/schema/
        is_a: wasAttributedTo
        slot_uri: rfs:assertedBy
        list_elements_ordered: false
        owner: Evaluation
        domain_of:
        - Claim
        range: Entity
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      assertedAt:
        name: assertedAt
        description: When the issuer made the judgment.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:assertedAt
        owner: Evaluation
        domain_of:
        - Claim
        range: datetime
        required: true
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+00:00$
      hasSubject:
        name: hasSubject
        description: The focal subject considered by the Evaluation, such as a project,
          plot, organization, activity, dataset or other resource.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasSubject
        owner: Evaluation
        domain_of:
        - Claim
        range: ClaimSubject
        required: true
        inlined: true
      hasEvidenceCitation:
        name: hasEvidenceCitation
        description: Evidence the issuer relied on, as citations.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasEvidenceCitation
        list_elements_ordered: false
        owner: Evaluation
        domain_of:
        - Claim
        range: EvidenceCitation
        multivalued: true
        inlined: true
        inlined_as_list: true
      wasRevisionOf:
        name: wasRevisionOf
        description: 'Identifier of the exact, immutable earlier Claim version that
          this Claim revises: its ClaimIRI. A Claim has no identifier slot, because
          its ClaimIRI is computed over its canonical form outside Claim content (regen-network/claims#1),
          so the value is a bare IRI and the slot names no class. It never names a
          logical claim or version family. In PROV a revision implies that both versions
          are aspects of the same thing (alternateOf), so use it only for a revised
          version of the same assertion; a separate, later assertion, such as a follow-up
          observation, is a new Claim and is not a revision. The earlier version is
          unchanged, its evaluations do not carry over, and selecting a current version
          happens outside the Claim.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: prov:wasRevisionOf
        owner: Evaluation
        domain_of:
        - Claim
        range: uriorcurie
    class_uri: rfs:Evaluation
  GenericEvaluation:
    name: GenericEvaluation
    description: An evaluation that uses only the shared Evaluation fields, for a
      judgment made under no program's vocabulary, such as a community steward's review.
      It means no more than Evaluation. Its result, if any, is a GenericEvaluationResult
      with the generic outcome.
    comments:
    - 'Implementation: it exists as its own class so that such an evaluation is validated
      with a closed shape, which the open Evaluation base cannot give its direct instances.'
    from_schema: https://framework.regen.network/schema/
    is_a: Evaluation
    slot_usage:
      hasResult:
        name: hasResult
        range: GenericEvaluationResult
    attributes:
      hasTarget:
        name: hasTarget
        description: The exact resource or resources directly examined or assessed
          in reaching the Evaluation's conclusion. When a resource can change, the
          target identifies the particular version or snapshot that was assessed.
          It is distinct from the Evaluation's focal subject (hasSubject) and from
          the criteria it applies (appliesRequirement).
        comments:
        - 'Implementation: each value is an IRI, never a logical identifier or label.
          Repeatable and unordered. The base slot does not restrict what kind of resource
          a target is; a kind of evaluation may require it or restrict it, as EvidenceSupportEvaluation
          does to Evidence records and ClaimConsistencyEvaluation to claim versions.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasTarget
        list_elements_ordered: false
        owner: GenericEvaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      reliesOn:
        name: reliesOn
        description: An exact Claim or Evaluation whose asserted content or result
          is used in reaching this Evaluation's assessment, but which is not itself
          directly assessed by the Evaluation, for example the claim stating an enrolment
          cutoff that a confirmation relies on.
        comments:
        - 'Implementation: each value is the IRI of one immutable version, such as
          a ClaimIRI. Repeatable and unordered. Specializes dcterms:references, so
          it asserts neither derivation nor support.'
        from_schema: https://framework.regen.network/schema/
        is_a: references
        slot_uri: rfs:reliesOn
        list_elements_ordered: false
        owner: GenericEvaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        multivalued: true
      appliesRequirement:
        name: appliesRequirement
        description: 'Exact requirement versions an evaluation applies or judges,
          whether or not the claimant named them. Each identifier names one immutable
          requirement version within an exact requirement-set version, such as a checklist
          version: the same short ID can name different requirements in different
          versions. The requirement and requirement-set records themselves are defined
          by WP5-01 (claims#30). Unordered set.'
