        range: DatePeriod
        inlined: true
      requestedDeviations:
        name: requestedDeviations
        description: Project-specific deviations from requirements that the project
          developer requests in its project plan, each naming the requirements it
          replaces. Whether a deviation is approved is a separate evaluation. Unordered
          set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:requestedDeviations
        list_elements_ordered: false
        owner: C06ProjectClaim
        domain_of:
        - C06ProjectClaim
        range: DeviationRequest
        multivalued: true
        inlined: true
        inlined_as_list: true
      name:
        name: name
        description: Optional human-readable title of the claim, for display. It is
          not the assertion, which is claimStatement.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:name
        owner: C06ProjectClaim
        domain_of:
        - Link
        - ProjectInfo
        - Feature
        - File
        - Impact
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - BufferPoolAccount
        - CreditClassInfo
        - Claim
        - Evidence
        - Activity
        - Entity
        range: string
      claimStatement:
        name: claimStatement
        description: 'The assertion, as the claimants state it in natural language.
          It is asserted content, not a presentational summary: changing it changes
          the Claim. A claim type may also formalize the assertion, or add detail
          to it, in structured fields; the statement and those fields are one assertion
          and must agree. When they disagree, neither overrides the other: the Claim
          is internally inconsistent and is corrected by a new version before its
          evidence is evaluated. Specializes schema:description.'
        from_schema: https://framework.regen.network/schema/
        is_a: description
        slot_uri: rfs:claimStatement
        owner: C06ProjectClaim
        domain_of:
        - Claim
        range: string
        required: true
      inLanguage:
        name: inLanguage
        description: Language of claimStatement, as a BCP 47 tag with a 2- or 3-letter
          ISO 639 primary language subtag, such as en or cs. It says nothing about
          the language of the cited sources, which they record themselves, or about
          how a statement translated from a source was derived.
        from_schema: https://framework.regen.network/schema/
        slot_uri: schema:inLanguage
        owner: C06ProjectClaim
        domain_of:
        - Claim
        - Evidence
        range: string
        pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$
      url:
        name: url
        description: Link to a page with more information about the claim. A pointer
          for readers, not evidence; cite evidence with hasEvidenceCitation.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:url
        owner: C06ProjectClaim
        domain_of:
        - Link
        - ProjectInfo
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - CreditClassInfo
        - Claim
        - Entity
        range: uri
      assertedBy:
        name: assertedBy
        description: 'The agent or agents that take responsibility for asserting this
          exact content: an individual, organization or community. Each listed claimant
          takes responsibility for the whole assertion. Taking that responsibility
          is distinct from writing, extracting, generating, transforming or submitting
          the content: a person, tool or service that only did that is not a claimant
          unless it takes responsibility for the assertion itself. A collective that
          asserts as one body is a single claimant of type COMMUNITY or ORGANIZATION;
          listing it does not make its members co-claimants. The capacity in which
          a claimant acts, such as project proponent or verifier, is a role in the
          context of the claim, not a kind of agent. Listing a claimant records who
          takes responsibility; it does not by itself establish that the claimant
          is authorized to assert on behalf of a project, community, program or other
          party. Specializes prov:wasAttributedTo, so under PROV each claimant is
          an agent associated with the activity that generated the Claim, which is
          the act of asserting. Unordered set.'
        from_schema: https://framework.regen.network/schema/
        is_a: wasAttributedTo
        slot_uri: rfs:assertedBy
        list_elements_ordered: false
        owner: C06ProjectClaim
        domain_of:
        - Claim
        range: Entity
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      assertedAt:
        name: assertedAt
        description: When the claimants made this assertion. For an assertion they
          made in a source document, such as a project plan, and that was transcribed
          later, it is when they made it there, not when it was extracted, transcribed
          or submitted. It is never the time of an observation, or the time the Claim
          record was generated, submitted, published or ingested. The same content
          asserted at a different time is a different Claim. Written in UTC with whole
          seconds and the offset +00:00, for example 2026-05-02T07:30:00+00:00. No
          other offset is accepted, and neither is the Z suffix.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:assertedAt
        owner: C06ProjectClaim
        domain_of:
        - Claim
        range: datetime
        required: true
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+00:00$
      hasSubject:
        name: hasSubject
        description: 'The one focal resource the claim is about, as a ClaimSubject
          node identified by its IRI: a place, plot, project, organization, community,
          indicator, dataset or another claim. It is not every participant the assertion
          mentions: in a claim relating several parties, the others appear in named
          roles defined by the claim-type schema, or the relationship or activity
          itself is the subject. Claims about the same subject share its IRI and can
          be joined. Specialized claim schemas narrow the range to a subclass of ClaimSubject.
          Not the claimant, and not necessarily the feature of interest of an observation
          inside the claim.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasSubject
        owner: C06ProjectClaim
        domain_of:
        - Claim
        range: Project
        required: true
        inlined: true
      hasEvidenceCitation:
        name: hasEvidenceCitation
        description: The evidence the claimant presents for the assertion, as citations.
          Each citation names one Evidence record by IRI (its source) and, optionally,
          selectors that locate the cited material inside it; a citation without selectors
          cites the whole source, and a source cited at several places has one citation
          per passage. The Evidence records are their own documents, described once
          and never inlined, and are reached through each citation's source. Whether
          the evidence supports the assertion is judged separately, by evaluations.
          Unordered set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasEvidenceCitation
        list_elements_ordered: false
        owner: C06ProjectClaim
        domain_of:
        - Claim
        range: EvidenceCitation
        multivalued: true
        inlined: true
        inlined_as_list: true
      wasRevisionOf:
        name: wasRevisionOf
        description: 'Identifier of the exact, immutable earlier Claim version that
          this Claim revises: its ClaimIRI. A Claim has no identifier slot, because
          its ClaimIRI is computed over its canonical form outside Claim content (regen-network/claims#1),
          so the value is a bare IRI and the slot names no class. It never names a
          logical claim or version family. In PROV a revision implies that both versions
          are aspects of the same thing (alternateOf), so use it only for a revised
          version of the same assertion; a separate, later assertion, such as a follow-up
          observation, is a new Claim and is not a revision. The earlier version is
          unchanged, its evaluations do not carry over, and selecting a current version
          happens outside the Claim.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: prov:wasRevisionOf
        owner: C06ProjectClaim
        domain_of:
        - Claim
        range: uriorcurie
    class_uri: rfs:C06ProjectClaim
