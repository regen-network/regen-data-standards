        - Impact
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - BufferPoolAccount
        - CreditClassInfo
        - Entity
        - ClaimSubject
        - Claim
        - Evidence
        - Attestation
        range: string
    class_uri: rfs:ClaimSubject
  ProvEntity:
    name: ProvEntity
    description: 'PROV-O Entity: a thing with some fixed aspects, such as a Claim
      version.'
    from_schema: https://framework.regen.network/schema/
    mixin: true
    class_uri: prov:Entity
  ProvAgent:
    name: ProvAgent
    description: 'PROV-O Agent: something that bears responsibility, such as a person,
      organization or community.'
    from_schema: https://framework.regen.network/schema/
    mixin: true
    class_uri: prov:Agent
  ProvActivity:
    name: ProvActivity
    description: 'PROV-O Activity: something that occurs over a period of time, such
      as the domain activity a specialized claim describes (a planting, a restoration)
      or the activity that produced a piece of evidence (a survey, a lab analysis).'
    from_schema: https://framework.regen.network/schema/
    mixin: true
    class_uri: prov:Activity
  Claim:
    name: Claim
    description: 'An attributed assertion: related statements that one or more identified
      claimants present together about a subject, at a stated time. A Claim is asserted
      by definition, so it is self-attested by its claimants and is valid without
      any third-party attestation; later reviews are separate resources that point
      to it. An unasserted authoring candidate, such as an extraction draft without
      a claimant, is not a Claim. Every version is immutable: a correction is a new
      Claim that states wasRevisionOf.'
    from_schema: https://framework.regen.network/schema/
    mixins:
    - ProvEntity
    slots:
    - name
    - description
    - url
    - hasClaimType
    - hasClaimant
    - assertedAt
    - hasSubject
    - hasEvidence
    - wasRevisionOf
    slot_usage:
      name:
        name: name
        description: Human-readable title of the claim.
        required: true
      description:
        name: description
        description: 'The assertion as the claimant states it in natural language.
          This is asserted content, not a presentational summary: changing it changes
          the Claim.'
      url:
        name: url
        description: Link to a page with more information about the claim. A pointer
          for readers, not evidence; cite evidence with hasEvidence.
      wasRevisionOf:
        name: wasRevisionOf
        description: Identifier of the exact, immutable earlier Claim version that
          this Claim revises, typically its ClaimIRI. It never names a logical claim
          or version family. In PROV a revision implies that both versions are aspects
          of the same thing (alternateOf), so use it only for a revised version of
          the same assertion; a separate, later assertion, such as a follow-up observation,
          is a new Claim and is not a revision. The earlier version is unchanged,
          its attestations do not carry over, and selecting a current version happens
          outside the Claim.
    attributes:
      name:
        name: name
        description: Human-readable title of the claim.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:name
        owner: Claim
        domain_of:
        - Link
        - ProjectInfo
        - Feature
        - File
        - Impact
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - BufferPoolAccount
        - CreditClassInfo
        - Entity
        - ClaimSubject
        - Claim
        - Evidence
        - Attestation
        range: string
        required: true
      description:
        name: description
        description: 'The assertion as the claimant states it in natural language.
          This is asserted content, not a presentational summary: changing it changes
          the Claim.'
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:description
        owner: Claim
        domain_of:
        - Link
        - ProjectInfo
        - File
        - CreditClassInfo
        - Entity
        - Claim
        - Evidence
        - Attestation
        range: string
      url:
        name: url
        description: Link to a page with more information about the claim. A pointer
          for readers, not evidence; cite evidence with hasEvidence.
        from_schema: https://framework.regen.network/schema/
        rank: 1
        slot_uri: schema:url
        owner: Claim
        domain_of:
        - Link
        - ProjectInfo
        - CreditingProgram
        - CreditProtocol
        - Methodology
        - Registry
        - CreditClassInfo
        - Entity
        - Claim
        range: uri
      hasClaimType:
        name: hasClaimType
        description: 'Subject-matter classification of what is asserted, drawn from
          the ClaimType taxonomy. It classifies content only: it does not declare
          which schema or schema version the document conforms to, and it does not
          by itself select a verification pathway.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasClaimType
        owner: Claim
        domain_of:
        - Claim
        range: ClaimType
        required: true
      hasClaimant:
        name: hasClaimant
        description: 'The agent or agents that take responsibility for making this
          assertion: an individual, organization or community. Each listed claimant
          takes responsibility for the whole assertion. A collective that asserts
          as one body is a single claimant of type COMMUNITY or ORGANIZATION; listing
          it does not make its members co-claimants. A service that extracted, generated
          or submitted the RDF is not a claimant unless it asserts the content itself.
          Specializes prov:wasAttributedTo, so under PROV each claimant is an agent
          associated with the activity that generated the Claim, which is the act
          of asserting. Unordered set.'
        from_schema: https://framework.regen.network/schema/
        is_a: wasAttributedTo
        slot_uri: rfs:hasClaimant
        list_elements_ordered: false
        owner: Claim
        domain_of:
        - Claim
        range: Entity
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      assertedAt:
        name: assertedAt
        description: When the claimants made this assertion. For an assertion they
          made in a source document, such as a project plan, and that was transcribed
          later, it is when they made it there, not when it was extracted, transcribed
          or submitted. It is never the time of an observation, or the time the Claim
          record was generated, submitted, published or ingested. The same content
          asserted at a different time is a different Claim. Written in UTC with whole
          seconds, in the XSD canonical form, for example 2026-05-02T07:30:00Z. A
          local offset is not accepted.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:assertedAt
        owner: Claim
        domain_of:
        - Claim
        range: datetime
        required: true
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      hasSubject:
        name: hasSubject
        description: 'What the claim is about, as a ClaimSubject node identified by
          its IRI: a place, plot, project, organization, community, indicator, dataset
          or another claim. Claims about the same subject share its IRI and can be
          joined. Specialized claim schemas narrow the range to a subclass of ClaimSubject.
          Not the claimant, and not necessarily the feature of interest of an observation
          inside the claim.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:hasSubject
        owner: Claim
        domain_of:
        - Claim
        range: ClaimSubject
        required: true
        inlined: true
      hasEvidence:
        name: hasEvidence
        description: Sources the claimant presents as evidence for the assertion,
          each an Evidence node identified by the IRI of the exact version cited.
          Whether a source actually supports the assertion is judged separately, by
          attestations. Specializes dcterms:references. Unordered set.
        from_schema: https://framework.regen.network/schema/
        is_a: references
        slot_uri: rfs:hasEvidence
        list_elements_ordered: false
        owner: Claim
        domain_of:
        - Claim
        range: Evidence
        multivalued: true
        inlined: true
        inlined_as_list: true
      wasRevisionOf:
        name: wasRevisionOf
        description: Identifier of the exact, immutable earlier Claim version that
          this Claim revises, typically its ClaimIRI. It never names a logical claim
          or version family. In PROV a revision implies that both versions are aspects
          of the same thing (alternateOf), so use it only for a revised version of
          the same assertion; a separate, later assertion, such as a follow-up observation,
          is a new Claim and is not a revision. The earlier version is unchanged,
          its attestations do not carry over, and selecting a current version happens
          outside the Claim.
        from_schema: https://framework.regen.network/schema/
        slot_uri: prov:wasRevisionOf
        owner: Claim
        domain_of:
        - Claim
        range: uriorcurie
    class_uri: rfs:Claim
