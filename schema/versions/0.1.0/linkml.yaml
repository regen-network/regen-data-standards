          and unordered.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:governedBy
        list_elements_ordered: false
        owner: C06ProjectClaim
        domain_of:
        - Evaluation
        - C06ProjectClaim
        range: uriorcurie
        multivalued: true
      methodologyUse:
