slots:
  name:
    name: name
    description: Name of the entity / resource.
    from_schema: https://framework.regen.network/schema/
    rank: 1
    slot_uri: schema:name
    domain_of:
    - Link
    - ProjectInfo
    - Feature
    - File
    - Impact
    - CreditingProgram
    - CreditProtocol
    - Methodology
    - Registry
    - BufferPoolAccount
    - CreditClassInfo
    - Claim
    - Evidence
    - Activity
    - Entity
  description:
    name: description
    description: Description of the entity / resource.
    from_schema: https://framework.regen.network/schema/
    rank: 1
    slot_uri: schema:description
    domain_of:
    - Link
    - ProjectInfo
    - File
    - CreditClassInfo
    - Evidence
    - Activity
    - Condition
    - Entity
  url:
    name: url
    description: Link to a valid URL where more information can be found about the
      entity / resource.
    from_schema: https://framework.regen.network/schema/
    rank: 1
    slot_uri: schema:url
    domain_of:
    - Link
    - ProjectInfo
    - CreditingProgram
    - CreditProtocol
    - Methodology
    - Registry
    - CreditClassInfo
    - Claim
    - Entity
    range: uri
  inLanguage:
    name: inLanguage
    description: Language of the natural-language text of the resource, as a BCP 47
      tag whose primary language subtag is a 2- or 3-letter ISO 639 code, such as
      en, cs or pt-BR. A tag that is only private use, such as x-regen, is not accepted.
      The pattern checks the form of the tag, not that its subtags are registered
      or current, so it also accepts some deprecated grandfathered tags, such as zh-min.
      A class that uses it says which of its texts the language applies to.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:inLanguage
    domain_of:
    - Claim
    - Evidence
    range: string
    pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$
  identifier:
    name: identifier
    description: Unique identifier for the resource / entity.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:identifier
    domain_of:
    - ReferenceId
    - CreditingProgram
    - CreditProtocol
    - Methodology
  version:
    name: version
    description: Version number of the resource / entity.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:version
    domain_of:
    - VersionedLink
    - CreditingProgram
    - CreditProtocol
    - Methodology
  image:
    name: image
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:image
    domain_of:
    - Entity
  projectStartDate:
    name: projectStartDate
    description: The start date of the project.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:startDate
    domain_of:
    - ProjectInfo
  projectEndDate:
    name: projectEndDate
    description: The end date of the project.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:endDate
    domain_of:
    - ProjectInfo
  asWKT:
    name: asWKT
    description: A WKT literal with an optional CRS prefix (e.g., '<http://www.opengis.net/def/crs/EPSG/0/4326>
      POINT(...)').
    from_schema: https://framework.regen.network/schema/
    slot_uri: geo:asWKT
    domain_of:
    - Geometry
    range: string
  hasGeometry:
    name: hasGeometry
    from_schema: https://framework.regen.network/schema/
    slot_uri: geo:hasGeometry
    domain_of:
    - Feature
    range: Geometry
  hasBoundingBox:
    name: hasBoundingBox
    description: A derived geometry representing the bounding box of the geometry
      or feature.
    from_schema: https://framework.regen.network/schema/
    slot_uri: geo:hasBoundingBox
    domain_of:
    - Feature
    range: Geometry
  hasCentroid:
    name: hasCentroid
    description: A derived geometry representing the centroid of the feature.
    from_schema: https://framework.regen.network/schema/
    slot_uri: geo:hasCentroid
    domain_of:
    - Feature
    range: Geometry
  claimStatement:
    name: claimStatement
    description: 'The assertion, as the claimants state it in natural language. It
      is asserted content, not a presentational summary: changing it changes the Claim.
      A claim type may also formalize the assertion, or add detail to it, in structured
      fields; the statement and those fields are one assertion and must agree. When
      they disagree, neither overrides the other: the Claim is internally inconsistent
      and is corrected by a new version before its evidence is evaluated. Specializes
      schema:description.'
    from_schema: https://framework.regen.network/schema/
    is_a: description
    slot_uri: rfs:claimStatement
    domain_of:
    - Claim
    range: string
    required: true
  assertedBy:
    name: assertedBy
    description: 'The agent or agents that take responsibility for asserting this
      exact content: an individual, organization or community. Each listed claimant
      takes responsibility for the whole assertion. Taking that responsibility is
      distinct from writing, extracting, generating, transforming or submitting the
      content: a person, tool or service that only did that is not a claimant unless
      it takes responsibility for the assertion itself. A collective that asserts
      as one body is a single claimant of type COMMUNITY or ORGANIZATION; listing
      it does not make its members co-claimants. The capacity in which a claimant
      acts, such as project proponent or verifier, is a role in the context of the
      claim, not a kind of agent. Listing a claimant records who takes responsibility;
      it does not by itself establish that the claimant is authorized to assert on
      behalf of a project, community, program or other party. Specializes prov:wasAttributedTo,
      so under PROV each claimant is an agent associated with the activity that generated
      the Claim, which is the act of asserting. Unordered set.'
    from_schema: https://framework.regen.network/schema/
    is_a: wasAttributedTo
    slot_uri: rfs:assertedBy
    list_elements_ordered: false
    domain_of:
    - Claim
    range: Entity
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  assertedAt:
    name: assertedAt
    description: When the claimants made this assertion. For an assertion they made
      in a source document, such as a project plan, and that was transcribed later,
      it is when they made it there, not when it was extracted, transcribed or submitted.
      It is never the time of an observation, or the time the Claim record was generated,
      submitted, published or ingested. The same content asserted at a different time
      is a different Claim. Written in UTC with whole seconds and the offset +00:00,
      for example 2026-05-02T07:30:00+00:00. No other offset is accepted, and neither
      is the Z suffix.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:assertedAt
    domain_of:
    - Claim
    range: datetime
    required: true
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+00:00$
  hasSubject:
    name: hasSubject
    description: 'The one focal resource the claim is about, as a ClaimSubject node
      identified by its IRI: a place, plot, project, organization, community, indicator,
      dataset or another claim. It is not every participant the assertion mentions:
      in a claim relating several parties, the others appear in named roles defined
      by the claim-type schema, or the relationship or activity itself is the subject.
      Claims about the same subject share its IRI and can be joined. Specialized claim
      schemas narrow the range to a subclass of ClaimSubject. Not the claimant, and
      not necessarily the feature of interest of an observation inside the claim.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:hasSubject
    domain_of:
    - Claim
    range: ClaimSubject
    required: true
    inlined: true
  sourceType:
    name: sourceType
    description: Genre of the cited source, from the DCMI Type Vocabulary, which the
      dcterms:type definition recommends. Finer kinds of evidence that a program accepts,
      such as a lease agreement, belong to that program's requirements, not to Evidence.
    from_schema: https://framework.regen.network/schema/
    slot_uri: dcterms:type
    domain_of:
    - Evidence
    range: DCMIType
    required: true
  mediaType:
    name: mediaType
    description: Media type of the source, for example application/pdf.
    from_schema: https://framework.regen.network/schema/
    slot_uri: dcterms:format
    domain_of:
    - Evidence
    range: string
  contentHash:
    name: contentHash
    description: Hash of the bytes of the cited source version. This is the hash of
      the source, which a citation needs; it is not the hash of the Claim or Evaluation
      that cites it, which is never part of its own content.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:contentHash
    domain_of:
    - Evidence
    range: ContentDigest
    required: true
    inlined: true
  resolver:
    name: resolver
    description: Where the bytes of the cited version can be fetched. The data can
      stay where its owner keeps it; the claim stores only the hash and the resolver.
      Unordered set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:resolver
    list_elements_ordered: false
    domain_of:
    - Evidence
    range: uri
    required: true
    multivalued: true
    minimum_cardinality: 1
  licence:
    name: licence
    description: IRI of the licence document or versioned licence terms in effect
      for this version of the source. When absent, the terms must be read as "unspecified
      — all rights reserved" (rfs:UnspecifiedAllRightsReserved), never as unrestricted.
    from_schema: https://framework.regen.network/schema/
    slot_uri: dcterms:license
    domain_of:
    - Evidence
    range: uri
  issued:
    name: issued
    description: Date of the cited version of the source.
    from_schema: https://framework.regen.network/schema/
    slot_uri: dcterms:issued
    domain_of:
    - Evidence
    range: date
  wasGeneratedBy:
    name: wasGeneratedBy
    description: 'The activity that produced the cited source, with its period and
      who carried it out: for example the soil sampling behind a results file, or
      the field operations a farm management record documents. When the evidence was
      produced is the activity''s period, not a field of Evidence, because PROV-O
      declares activities and entities disjoint. Evidence produced by the same activity
      names the same activity IRI.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: prov:wasGeneratedBy
    domain_of:
    - Evidence
    range: Activity
    inlined: true
  source:
    name: source
    description: 'The cited source: the IRI of an Evidence record.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: oa:hasSource
    domain_of:
    - EvidenceCitation
    range: Evidence
    inlined: false
  selector:
    name: selector
    description: How to locate the cited segment of the source. Several selectors
      are alternatives that locate the same segment. Unordered set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: oa:hasSelector
    list_elements_ordered: false
    domain_of:
    - EvidenceCitation
    range: Selector
    multivalued: true
    inlined: true
    inlined_as_list: true
    any_of:
    - range: FragmentSelector
    - range: TextQuoteSelector
  selectorType:
    name: selectorType
    description: 'The kind of selector, as a CURIE: oa:FragmentSelector or oa:TextQuoteSelector.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rdf:type
    designates_type: true
    domain_of:
    - Selector
    range: uriorcurie
    required: true
  refinedBy:
    name: refinedBy
    description: A selector applied to the segment this one selects, for example a
      quotation within a page. Several are alternatives with the same result. Unordered
      set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: oa:refinedBy
    list_elements_ordered: false
    domain_of:
    - Selector
    range: Selector
    multivalued: true
    inlined: true
    inlined_as_list: true
    any_of:
    - range: FragmentSelector
    - range: TextQuoteSelector
  value:
    name: value
    description: The fragment identifier, without the leading "#", such as page=16.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rdf:value
    domain_of:
    - FragmentSelector
    range: string
  conformsTo:
    name: conformsTo
    description: The specification of the fragment syntax, for example http://tools.ietf.org/rfc/rfc3778
      for PDF or http://www.w3.org/TR/media-frags/ for audio and video.
    from_schema: https://framework.regen.network/schema/
    slot_uri: dcterms:conformsTo
    domain_of:
    - FragmentSelector
    range: uri
  exact:
    name: exact
    description: The exact text of the passage.
    from_schema: https://framework.regen.network/schema/
    slot_uri: oa:exact
    domain_of:
    - TextQuoteSelector
    range: string
  prefix:
    name: prefix
    description: Text immediately before the passage.
    from_schema: https://framework.regen.network/schema/
    slot_uri: oa:prefix
    domain_of:
    - TextQuoteSelector
    range: string
  suffix:
    name: suffix
    description: Text immediately after the passage.
    from_schema: https://framework.regen.network/schema/
    slot_uri: oa:suffix
    domain_of:
    - TextQuoteSelector
    range: string
  wasAssociatedWith:
    name: wasAssociatedWith
    description: 'Responsibility of an agent for an activity (PROV), for example the
      farm operator who carried out the field operations a record documents. Claim-type
      schemas that describe a domain activity, such as a restoration, name its operator
      the same way. Use it only on a class that represents an activity (its PROV domain
      is prov:Activity); such classes declare the ProvActivity mixin. It is not attribution
      of a Claim: the operator and the claimant may differ, and when they coincide
      both relations are still stated.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: prov:wasAssociatedWith
    list_elements_ordered: false
    domain_of:
    - Activity
    range: Entity
    multivalued: true
    inlined: true
    inlined_as_list: true
  startDate:
    name: startDate
    description: First day of the period, included.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:startDate
    domain_of:
    - Activity
    - DatePeriod
    range: date
  endDate:
    name: endDate
    description: Last day of the period, included.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:endDate
    domain_of:
    - Activity
    - DatePeriod
    range: date
  wasAttributedTo:
    name: wasAttributedTo
    description: 'PROV attribution: the ascribing of an entity to an agent. PROV infers
      that the agent was associated with an activity that generated the entity. Declared
      here so that narrower attribution relations, such as assertedBy, can specialize
      it (rdfs:subPropertyOf) instead of redefining its meaning. Every value of a
      specializing slot therefore implies this relation; the reverse does not hold.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: prov:wasAttributedTo
    list_elements_ordered: false
    range: Entity
    multivalued: true
    inlined: true
    inlined_as_list: true
  wasRevisionOf:
    name: wasRevisionOf
    description: 'Identifier of the exact, immutable earlier version this resource
      revises (a PROV revision, itself a derivation, so do not also state prov:wasDerivedFrom
      for it). PROV infers that the two versions are aspects of the same thing (alternateOf);
      a resource that merely builds on another is not its revision. It must name one
      version, never a logical or version-family identifier. Stating a revision neither
      makes this version current nor carries over any evaluation of the earlier one;
      which version an application accepts is maintained outside the resource. The
      value is a bare IRI: this schema does not describe the earlier version, so the
      slot names no class.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: prov:wasRevisionOf
    domain_of:
    - Claim
    range: uriorcurie
  references:
    name: references
    description: 'Dublin Core citation: a resource the described resource references,
      cites or otherwise points to. Declared here so that narrower relations, such
      as reliesOn, can specialize it (rdfs:subPropertyOf); a citation alone asserts
      neither derivation nor support. Each value is the IRI of the cited resource.
      A citation asserts nothing about that resource: its description, type and integrity
      information live on the resource itself, shaped by its own schema. Unordered
      set.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: dcterms:references
    list_elements_ordered: false
    range: uriorcurie
    multivalued: true
  hasEvidenceCitation:
    name: hasEvidenceCitation
    description: The evidence the claimant presents for the assertion, as citations.
      Each citation names one Evidence record by IRI (its source) and, optionally,
      selectors that locate the cited material inside it; a citation without selectors
      cites the whole source, and a source cited at several places has one citation
      per passage. The Evidence records are their own documents, described once and
      never inlined, and are reached through each citation's source. Whether the evidence
      supports the assertion is judged separately, by evaluations. Unordered set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:hasEvidenceCitation
    list_elements_ordered: false
    domain_of:
    - Claim
    range: EvidenceCitation
    multivalued: true
    inlined: true
    inlined_as_list: true
  reliesOn:
    name: reliesOn
    description: An exact Claim or Evaluation whose asserted content or result is
      used in reaching this Evaluation's assessment, but which is not itself directly
      assessed by the Evaluation, for example the claim stating an enrolment cutoff
      that a confirmation relies on.
    comments:
    - 'Implementation: each value is the IRI of one immutable version, such as a ClaimIRI.
      Repeatable and unordered. Specializes dcterms:references, so it asserts neither
      derivation nor support.'
    from_schema: https://framework.regen.network/schema/
    is_a: references
    slot_uri: rfs:reliesOn
    list_elements_ordered: false
    domain_of:
    - Evaluation
    range: uriorcurie
    multivalued: true
  hasTarget:
    name: hasTarget
    description: The exact resource or resources directly examined or assessed in
      reaching the Evaluation's conclusion. When a resource can change, the target
      identifies the particular version or snapshot that was assessed. It is distinct
      from the Evaluation's focal subject (hasSubject) and from the criteria it applies
      (appliesRequirement).
    comments:
    - 'Implementation: each value is an IRI, never a logical identifier or label.
      Repeatable and unordered. The base slot does not restrict what kind of resource
      a target is; a kind of evaluation may require it or restrict it, as EvidenceSupportEvaluation
      does to Evidence records and ClaimConsistencyEvaluation to claim versions.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:hasTarget
    list_elements_ordered: false
    domain_of:
    - Evaluation
    range: uriorcurie
    multivalued: true
  appliesRequirement:
    name: appliesRequirement
    description: 'Exact requirement versions an evaluation applies or judges, whether
      or not the claimant named them. Each identifier names one immutable requirement
      version within an exact requirement-set version, such as a checklist version:
      the same short ID can name different requirements in different versions. The
      requirement and requirement-set records themselves are defined by WP5-01 (claims#30).
      Unordered set.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:appliesRequirement
    list_elements_ordered: false
    domain_of:
    - Evaluation
    range: uriorcurie
    multivalued: true
  addressesRequirement:
    name: addressesRequirement
    description: 'Exact requirement versions the claimant presents a Claim, or part
      of it, as responding to, identified as for appliesRequirement. It records the
      claimant''s intent only: it implies neither that the requirement applies nor
      that it is met, conformed to or accepted, which an evaluation judges with appliesRequirement.
      Not on the base Claim: a claim type selects it where it needs it. Unordered
      set.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:addressesRequirement
    list_elements_ordered: false
    domain_of:
    - DeviationRequest
    range: uriorcurie
    multivalued: true
  appliesRequirementSet:
    name: appliesRequirementSet
    description: 'Exact versions of requirement sets, such as a registration or validation
      checklist version, that an evaluation applies or assesses as a whole. An evaluation
      of one requirement names only that requirement (appliesRequirement): its set
      is reached through the requirement''s membership, defined by WP5-01 (claims#30).'
    comments:
    - 'Implementation: each value is the IRI of one requirement-set version. Repeatable
      and unordered.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:appliesRequirementSet
    list_elements_ordered: false
    domain_of:
    - Evaluation
    range: uriorcurie
    multivalued: true
  governedBy:
    name: governedBy
    description: Exact versions of the governing documents a claim or evaluation is
      made under, such as a credit class, a methodology or a program guide version.
      A governing document is broader than a set of requirements, which is named with
      appliesRequirementSet. It is content and enters the identity of the record,
      and is distinct from a schema-version declaration, which states which schema
      the RDF conforms to.
    comments:
    - 'Implementation: each value is the IRI of one exact document version. Repeatable
      and unordered.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:governedBy
    list_elements_ordered: false
    domain_of:
    - Evaluation
    - C06ProjectClaim
    range: uriorcurie
    multivalued: true
  evaluationMethod:
    name: evaluationMethod
    description: The procedures the evaluator used to reach the assessment, such as
      a document review or a site inspection. It is not who evaluated (that is assertedBy,
      and any role a program records) nor how the evidence was produced (that is the
      evidence's generating activity).
    comments:
    - 'Implementation: each value is the IRI of a method, so a method is defined once
      and reused, and another program can use its own terms. EvaluationMethodType
      lists the recommended shared methods by their meaning IRIs. Repeatable and unordered.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:evaluationMethod
    list_elements_ordered: false
    domain_of:
    - Evaluation
    range: uriorcurie
    multivalued: true
  evaluationMethodDescription:
    name: evaluationMethodDescription
    description: How the evaluator reached the assessment, in their words, for example
      which records were compared and how.
    comments:
    - 'Implementation: must contain a non-whitespace character, so an empty description
      is rejected rather than standing in for none.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:evaluationMethodDescription
    domain_of:
    - Evaluation
    range: string
    pattern: \S
  hasResult:
    name: hasResult
    description: The conclusion of the Evaluation, as a result whose type depends
      on the kind of evaluation.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:hasResult
    domain_of:
    - Evaluation
    range: EvaluationResult
    inlined: true
  outcome:
    name: outcome
    description: The principal conclusion of an evaluation result. A GenericEvaluationResult
      states it as a term from the vocabulary of whoever made the judgment; every
      other result type states it with its own sub-property of outcome whose values
      that kind allows, such as requirementOutcome or evidentialStance, so both validators
      check the value and a query for outcome still finds every principal conclusion.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:outcome
    domain_of:
    - GenericEvaluationResult
    range: uriorcurie
  assessedAgainst:
    name: assessedAgainst
    description: The exact Claim version that an evidence support evaluation's stance
      and sufficiency are relative to, as the IRI of that version.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:assessedAgainst
    domain_of:
    - EvidenceSupportEvaluation
    range: uriorcurie
  evidentialStance:
    name: evidentialStance
    description: Whether the evidence supports or challenges what it is assessed against,
      or has no bearing on it. A sub-property of outcome.
    from_schema: https://framework.regen.network/schema/
    is_a: outcome
    slot_uri: rfs:evidentialStance
    domain_of:
    - EvidenceSupportResult
    range: EvidentialStance
  evidenceSufficiency:
    name: evidenceSufficiency
    description: 'Whether the evidence is enough to establish its stance: sufficient
      supporting evidence establishes the claim, and sufficient challenging evidence
      contradicts it. It qualifies the stance; it is not a conclusion of its own,
      so it is not a sub-property of outcome.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:evidenceSufficiency
    domain_of:
    - EvidenceSupportResult
    range: EvidenceSufficiency
  claimConsistency:
    name: claimConsistency
    description: Whether the claim's statement and structured fields agree. A sub-property
      of outcome.
    from_schema: https://framework.regen.network/schema/
    is_a: outcome
    slot_uri: rfs:claimConsistency
    domain_of:
    - ClaimConsistencyResult
    range: ClaimConsistency
  rationale:
    name: rationale
    description: Why the issuer reached the result.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:rationale
    domain_of:
    - Evaluation
    range: string
  scope:
    name: scope
    description: The explicit subject or complete set of subjects across which the
      Evaluation's result is asserted, when that applicability is not fully expressed
      by its focal subject, with what it explicitly excludes and what it does not
      establish.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:scope
    domain_of:
    - RequirementEvaluation
    range: Scope
    inlined: true
  appliesTo:
    name: appliesTo
    description: Identifiers of the subjects the judgment covers, for example the
      enrolment cohorts an approval is limited to. Unordered set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:appliesTo
    list_elements_ordered: false
    domain_of:
    - Scope
    range: uriorcurie
    multivalued: true
  exclusion:
    name: exclusion
    description: What the judgment explicitly does not cover. Unordered set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:exclusion
    list_elements_ordered: false
    domain_of:
    - Scope
    range: string
    multivalued: true
  limitation:
    name: limitation
    description: What the judgment is not, for example that an approval of a project
      structure is not a validation of its evidence.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:limitation
    domain_of:
    - Scope
    range: string
  applicability:
    name: applicability
    description: Whether the applied requirement applies to the subject.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:applicability
    domain_of:
    - RequirementAssessmentResult
    range: Applicability
  requirementOutcome:
    name: requirementOutcome
    description: Whether the applied requirement is satisfied, as of this record's
      date. A sub-property of outcome.
    from_schema: https://framework.regen.network/schema/
    is_a: outcome
    slot_uri: rfs:requirementOutcome
    domain_of:
    - RequirementAssessmentResult
    range: RequirementOutcome
  findingLabel:
    name: findingLabel
    description: The issuer's own identifier for a finding, stable across review rounds,
      such as "CL 07(1)". It groups the dated records about one finding; it is not
      the identifier of any of them.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:findingLabel
    domain_of:
    - RegistryFindingEvaluation
    range: string
  findingType:
    name: findingType
    description: 'What the finding asks for: a correction, a clarification or a follow-up
      at a later verification. Who raised it is issuerRole, not the finding type,
      so a finding the Registry Agent raises uses the same types as a verifier''s,
      or OTHER when its record does not say which.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:findingType
    domain_of:
    - RegistryFindingEvaluation
    range: FindingType
  findingResolution:
    name: findingResolution
    description: Whether the finding is resolved as of the record's date. A sub-property
      of outcome.
    from_schema: https://framework.regen.network/schema/
    is_a: outcome
    slot_uri: rfs:findingResolution
    domain_of:
    - FindingResolutionResult
    range: FindingResolution
  verificationOpinion:
    name: verificationOpinion
    description: The verifier's opinion of the project in its report. A sub-property
      of outcome.
    from_schema: https://framework.regen.network/schema/
    is_a: outcome
    slot_uri: rfs:verificationOpinion
    domain_of:
    - VerificationOpinionResult
    range: VerificationOpinion
  issuerRole:
    name: issuerRole
    description: The capacity in which the issuer is recorded as acting for this judgment.
      This value does not by itself establish the issuer's authority to act in that
      capacity.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:issuerRole
    domain_of:
    - RegistryReviewEvaluation
    range: IssuerRole
  conditions:
    name: conditions
    description: Obligations the judgment carries to a later milestone, such as follow-up
      actions due before verification. Unordered set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:conditions
    list_elements_ordered: false
    domain_of:
    - RegistryReviewEvaluation
    range: Condition
    multivalued: true
    inlined: true
    inlined_as_list: true
  conditionLabel:
    name: conditionLabel
    description: The issuer's label for the condition, such as "RA-6".
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:conditionLabel
    domain_of:
    - Condition
    range: string
  milestone:
    name: milestone
    description: When the condition must be met.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:milestone
    domain_of:
    - Condition
    range: Milestone
  registryProjectId:
    name: registryProjectId
    description: The project's identifier in the registry, once assigned.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:registryProjectId
    domain_of:
    - Project
    range: string
  baselineYear:
    name: baselineYear
    description: Year of the cohort's baseline soil sampling.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:baselineYear
    domain_of:
    - Cohort
    range: integer
  project:
    name: project
    description: Identifier of the project this subject belongs to.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:project
    domain_of:
    - Cohort
    - Site
    range: uriorcurie
  cohort:
    name: cohort
    description: Identifier of the site's cohort.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:cohort
    domain_of:
    - Site
    range: uriorcurie
  site:
    name: site
    description: Identifier of the plot's site.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:site
    domain_of:
    - Plot
    range: uriorcurie
  siteKey:
    name: siteKey
    description: The key that identifies the site in the project's records.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:siteKey
    domain_of:
    - Site
    range: string
  plotKey:
    name: plotKey
    description: The key that identifies the plot in the project's records.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:plotKey
    domain_of:
    - Plot
    range: string
  parcelId:
    name: parcelId
    description: Identifier of the parcel in the national land parcel register, for
      example LPIS in Czechia or GSAA in Slovakia.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:parcelId
    domain_of:
    - Plot
    range: string
  country:
    name: country
    description: ISO 3166-1 alpha-2 country code.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:addressCountry
    domain_of:
    - Site
    range: string
    pattern: ^[A-Z]{2}$
  methodologyUse:
    name: methodologyUse
    description: The methodology versions the project applies, each with its role
      and what it is used for. Unordered set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:methodologyUse
    list_elements_ordered: false
    domain_of:
    - C06ProjectClaim
    range: MethodologyUse
    multivalued: true
    inlined: true
    inlined_as_list: true
  methodology:
    name: methodology
    description: Identifier of an exact methodology version.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:methodology
    domain_of:
    - MethodologyUse
    range: uriorcurie
  methodologyRole:
    name: methodologyRole
    description: Whether the methodology is the project's primary quantification methodology
      or a supplementary one, used for part of the assessment such as the baseline
      or leakage.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:methodologyRole
    domain_of:
    - MethodologyUse
    range: MethodologyRole
  methodologyScope:
    name: methodologyScope
    description: What the methodology is used for in this project.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:methodologyScope
    domain_of:
    - MethodologyUse
    range: string
  isAggregateProject:
    name: isAggregateProject
    description: 'True when the project is an aggregate project: a group of sites,
      each individually identifiable, registered as one project.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:isAggregateProject
    domain_of:
    - C06ProjectClaim
    range: boolean
  ecosystemTypes:
    name: ecosystemTypes
    description: Ecosystem types of the site, as taxonomy terms such as cropland or
      pastureland. Unordered set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:ecosystemTypes
    list_elements_ordered: false
    domain_of:
    - C06SiteClaim
    range: EnvironmentType
    multivalued: true
  practices:
    name: practices
    description: Practices implemented on the site.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:practices
    list_elements_ordered: false
    domain_of:
    - C06SiteClaim
    range: ActivityType
    multivalued: true
  aggregateStartDate:
    name: aggregateStartDate
    description: Start date of the aggregate project. Each site also has its own start
      date (siteProjectStartDate).
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:aggregateStartDate
    domain_of:
    - C06ProjectClaim
    range: date
  siteProjectStartDate:
    name: siteProjectStartDate
    description: The site's own project start date. In an aggregate project each site
      defines its own, which may differ from the aggregate's; its basis is stated
      in startDateBasis.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:siteProjectStartDate
    domain_of:
    - C06SiteClaim
    range: date
  startDateBasis:
    name: startDateBasis
    description: The event or record that establishes the start date, for example
      the first baseline soil sampling or a contract signature.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:startDateBasis
    domain_of:
    - C06ProjectClaim
    - C06SiteClaim
    range: string
  adoptionDate:
    name: adoptionDate
    description: When the project activities were adopted.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:adoptionDate
    domain_of:
    - C06ProjectClaim
    range: date
  creditingPeriod:
    name: creditingPeriod
    description: The period during which credits can be issued for the subject. In
      an aggregate project, cohorts and sites may have their own.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:creditingPeriod
    domain_of:
    - C06ProjectClaim
    - C06CohortClaim
    - C06SiteClaim
    range: DatePeriod
    inlined: true
  permanencePeriod:
    name: permanencePeriod
    description: The period after the crediting period during which the carbon stored
      must be maintained.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:permanencePeriod
    domain_of:
    - C06ProjectClaim
    - C06CohortClaim
    range: DatePeriod
    inlined: true
  area:
    name: area
    description: Area, as a QUDT quantity value.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:area
    domain_of:
    - C06PlotClaim
    range: QuantityValue
    inlined: true
  requestedDeviations:
    name: requestedDeviations
    description: Project-specific deviations from requirements that the project developer
      requests in its project plan, each naming the requirements it replaces. Whether
      a deviation is approved is a separate evaluation. Unordered set.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:requestedDeviations
    list_elements_ordered: false
    domain_of:
    - C06ProjectClaim
    range: DeviationRequest
    multivalued: true
    inlined: true
    inlined_as_list: true
  replacedParameters:
    name: replacedParameters
    description: What the deviation replaces, and with what.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:replacedParameters
    domain_of:
    - DeviationRequest
    range: string
  justification:
    name: justification
    description: Why the deviation is requested, including why it is as conservative
      as the requirement it replaces.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:justification
    domain_of:
    - DeviationRequest
    range: string
  climateClass:
    name: climateClass
    description: Köppen-Geiger climate class, for example Dfb.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:climateClass
    domain_of:
    - C06SiteClaim
    range: string
  soilGroup:
    name: soilGroup
    description: World Reference Base soil group, for example Cambisol.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:soilGroup
    domain_of:
    - C06SiteClaim
    range: string
  primaryLandUse:
    name: primaryLandUse
    description: The site's primary land use, as a taxonomy term, which the site must
      maintain during its project period.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:primaryLandUse
    domain_of:
    - C06SiteClaim
    range: EnvironmentType
  monitoringSampleDates:
    name: monitoringSampleDates
    description: Dates of soil sampling at the site.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:monitoringSampleDates
    list_elements_ordered: false
    domain_of:
    - C06SiteClaim
    range: date
    multivalued: true
  monitoringIntervalJustification:
    name: monitoringIntervalJustification
    description: Why sampling intervals differ from the expected cadence.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:monitoringIntervalJustification
    domain_of:
    - C06SiteClaim
    range: string
  geometry:
    name: geometry
    description: Identifier of the boundary feature, for example a feature in a cited
      GeoPackage. One feature may cover more than one plot.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:geometry
    domain_of:
    - C06PlotClaim
    range: uriorcurie
  tenureBasis:
    name: tenureBasis
    description: 'The legal basis on which the plot is controlled during the crediting
      period: ownership, a lease, or another arrangement.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:tenureBasis
    domain_of:
    - C06PlotClaim
    range: TenureBasis
  convertedFromNaturalEcosystem:
    name: convertedFromNaturalEcosystem
    description: Whether the plot was converted from forest land, wetland or another
      natural ecosystem in the ten years before its site's project start date.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:convertedFromNaturalEcosystem
    domain_of:
    - C06PlotClaim
    range: boolean
