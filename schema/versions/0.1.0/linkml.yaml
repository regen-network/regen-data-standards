    - ClaimSubject
    - Claim
    - Evidence
    - Attestation
  description:
    name: description
    description: Description of the entity / resource.
    from_schema: https://framework.regen.network/schema/
    rank: 1
    slot_uri: schema:description
    domain_of:
    - Link
    - ProjectInfo
    - File
    - CreditClassInfo
    - Entity
    - Claim
    - Evidence
    - Attestation
  url:
    name: url
    description: Link to a valid URL where more information can be found about the
      entity / resource.
    from_schema: https://framework.regen.network/schema/
    rank: 1
    slot_uri: schema:url
    domain_of:
    - Link
