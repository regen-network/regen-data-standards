  ClaimType:
    name: ClaimType
    description: Subject-matter categories of claims. A category classifies what a
      claim asserts; it does not declare a schema version or select a verification
      pathway.
    from_schema: https://framework.regen.network/schema/
    permissible_values:
      ECOLOGICAL:
        text: ECOLOGICAL
        description: Claims about ecological outcomes such as carbon sequestration,
          biodiversity, soil health, or water quality.
        meaning: rft:Ecological
        title: Ecological
      SOCIAL:
        text: SOCIAL
        description: Claims about social outcomes such as community well-being, livelihoods,
          education, or cultural preservation.
        meaning: rft:Social
        title: Social
      FINANCIAL:
        text: FINANCIAL
        description: Claims about financial outcomes such as revenue generation, cost
          savings, or investment returns from regenerative practices.
        meaning: rft:Financial
        title: Financial
      GOVERNANCE:
        text: GOVERNANCE
        description: Claims about governance outcomes such as stakeholder participation,
          decision-making processes, or institutional arrangements.
        meaning: rft:Governance
        title: Governance
      BIOCULTURAL:
        text: BIOCULTURAL
        description: Claims about biocultural outcomes integrating ecological and
          cultural dimensions, such as traditional ecological knowledge or indigenous
          stewardship.
        meaning: rft:Biocultural
        title: Biocultural
  VerificationStatus:
    name: VerificationStatus
    description: Lifecycle states of a claim as it moves through verification. Each
      state represents increasing levels of assurance.
    from_schema: https://framework.regen.network/schema/
    permissible_values:
      SELF_REPORTED:
        text: SELF_REPORTED
        description: Claim submitted by the claimant without independent review.
        meaning: rft:SelfReported
        title: SelfReported
      PEER_REVIEWED:
        text: PEER_REVIEWED
        description: Claim reviewed by one or more peer attestors.
        meaning: rft:PeerReviewed
        title: PeerReviewed
      VERIFIED:
        text: VERIFIED
        description: Claim verified by an accredited or authorized verifier.
        meaning: rft:Verified
        title: Verified
      LEDGER_ANCHORED:
        text: LEDGER_ANCHORED
        description: Claim anchored on-chain via Regen Data Module with a content
          hash.
        meaning: rft:LedgerAnchored
        title: LedgerAnchored
      WITHDRAWN:
        text: WITHDRAWN
        description: Claim withdrawn by the claimant or invalidated through review.
        meaning: rft:Withdrawn
        title: Withdrawn
  VerdictType:
    name: VerdictType
    description: Possible verdicts an attestor can assign when reviewing a claim.
    from_schema: https://framework.regen.network/schema/
    permissible_values:
      PENDING:
        text: PENDING
        description: Attestation is in progress; no verdict has been rendered yet.
        meaning: rft:Pending
        title: Pending
      APPROVED:
        text: APPROVED
        description: The claim has been reviewed and approved by the attestor.
        meaning: rft:Approved
        title: Approved
      REJECTED:
        text: REJECTED
        description: The claim has been reviewed and rejected by the attestor.
        meaning: rft:Rejected
        title: Rejected
      NEEDS_INFO:
        text: NEEDS_INFO
        description: The attestor requires additional information or evidence before
          rendering a verdict.
        meaning: rft:NeedsInfo
        title: NeedsInfo
