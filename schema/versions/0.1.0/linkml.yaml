  EvaluationResult:
    name: EvaluationResult
    description: 'The conclusion of an Evaluation: its principal outcome and any qualifiers
      of that outcome. Each kind of evaluation has its own result type, whose outcome
      field is a sub-property of outcome with the values that kind allows. Attribution,
      time, subject, targets, method and rationale stay on the Evaluation.'
    comments:
    - 'Implementation: abstract, so its generated shape is open. Each result type
      narrows its own outcome sub-property rather than one shared outcome field, because
      LinkML 1.11 cannot narrow an enum-valued slot in a subclass without breaking
      the RDF conversion of its Python model.'
    from_schema: https://framework.regen.network/schema/
    abstract: true
    class_uri: rfs:EvaluationResult
  GenericEvaluationResult:
    name: GenericEvaluationResult
    description: 'The result of a GenericEvaluation: a generic outcome, as a term
      from the vocabulary of whoever made the judgment.'
    from_schema: https://framework.regen.network/schema/
    is_a: EvaluationResult
    slots:
    - outcome
    attributes:
      outcome:
        name: outcome
        description: The principal conclusion of an evaluation result. A GenericEvaluationResult
          states it as a term from the vocabulary of whoever made the judgment; every
          other result type states it with its own sub-property of outcome whose values
          that kind allows, such as requirementOutcome or evidentialStance, so both
          validators check the value and a query for outcome still finds every principal
          conclusion.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:outcome
        owner: GenericEvaluationResult
        domain_of:
        - GenericEvaluationResult
        range: uriorcurie
    class_uri: rfs:GenericEvaluationResult
  RequirementAssessmentResult:
    name: RequirementAssessmentResult
    description: 'The result of a RequirementEvaluation: whether the requirement applies
      to the subject and, when it does, whether the subject satisfies it.'
    from_schema: https://framework.regen.network/schema/
    is_a: EvaluationResult
    slots:
    - applicability
    - requirementOutcome
    slot_usage:
      applicability:
        name: applicability
        required: true
    attributes:
      applicability:
        name: applicability
        description: Whether the applied requirement applies to the subject.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:applicability
        owner: RequirementAssessmentResult
        domain_of:
        - RequirementAssessmentResult
        range: Applicability
        required: true
      requirementOutcome:
        name: requirementOutcome
        description: Whether the applied requirement is satisfied, as of this record's
          date. A sub-property of outcome.
        from_schema: https://framework.regen.network/schema/
        is_a: outcome
        slot_uri: rfs:requirementOutcome
        owner: RequirementAssessmentResult
        domain_of:
        - RequirementAssessmentResult
        range: RequirementOutcome
    class_uri: rfs:RequirementAssessmentResult
    rules:
    - preconditions:
        slot_conditions:
          applicability:
            name: applicability
            equals_string: APPLICABLE
      postconditions:
        slot_conditions:
          requirementOutcome:
            name: requirementOutcome
            required: true
      description: An applicable requirement has an outcome. Enforced by the generated
        JSON Schema; the generated SHACL does not express LinkML rules.
    - preconditions:
        slot_conditions:
          applicability:
            name: applicability
            equals_string: NOT_APPLICABLE
      postconditions:
        slot_conditions:
          requirementOutcome:
            name: requirementOutcome
            value_presence: ABSENT
      description: A requirement that does not apply has no outcome. Enforced by the
        generated JSON Schema; the generated SHACL does not express LinkML rules.
  EvidenceSupportResult:
    name: EvidenceSupportResult
    description: 'The result of an EvidenceSupportEvaluation: whether the evidence
      supports, challenges or has no bearing on the claim and, where assessed, whether
      it is sufficient to establish that stance.'
    from_schema: https://framework.regen.network/schema/
    is_a: EvaluationResult
    slots:
    - evidentialStance
    - evidenceSufficiency
    slot_usage:
      evidentialStance:
        name: evidentialStance
        required: true
    attributes:
      evidentialStance:
        name: evidentialStance
        description: Whether the evidence supports or challenges what it is assessed
          against, or has no bearing on it. A sub-property of outcome.
        from_schema: https://framework.regen.network/schema/
        is_a: outcome
        slot_uri: rfs:evidentialStance
        owner: EvidenceSupportResult
        domain_of:
        - EvidenceSupportResult
        range: EvidentialStance
        required: true
      evidenceSufficiency:
        name: evidenceSufficiency
        description: 'Whether the evidence is enough to establish its stance: sufficient
          supporting evidence establishes the claim, and sufficient challenging evidence
          contradicts it. It qualifies the stance; it is not a conclusion of its own,
          so it is not a sub-property of outcome.'
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:evidenceSufficiency
        owner: EvidenceSupportResult
        domain_of:
        - EvidenceSupportResult
        range: EvidenceSufficiency
    class_uri: rfs:EvidenceSupportResult
    rules:
    - preconditions:
        slot_conditions:
          evidentialStance:
            name: evidentialStance
            equals_string: NO_BEARING
      postconditions:
        slot_conditions:
          evidenceSufficiency:
            name: evidenceSufficiency
            value_presence: ABSENT
      description: Evidence with no bearing on the claim establishes nothing, so it
        has no sufficiency. Enforced by the generated JSON Schema; the generated SHACL
        does not express LinkML rules.
  ClaimConsistencyResult:
    name: ClaimConsistencyResult
    description: 'The result of a ClaimConsistencyEvaluation: whether the claim''s
      statement and structured fields express the same assertion.'
    from_schema: https://framework.regen.network/schema/
    is_a: EvaluationResult
    slots:
    - claimConsistency
    slot_usage:
      claimConsistency:
        name: claimConsistency
        required: true
    attributes:
      claimConsistency:
        name: claimConsistency
        description: Whether the claim's statement and structured fields agree. A
          sub-property of outcome.
        from_schema: https://framework.regen.network/schema/
        is_a: outcome
        slot_uri: rfs:claimConsistency
        owner: ClaimConsistencyResult
        domain_of:
        - ClaimConsistencyResult
        range: ClaimConsistency
        required: true
    class_uri: rfs:ClaimConsistencyResult
  Scope:
    name: Scope
    description: Where an evaluation's result applies, as structured fields, so that
      a consumer can check whether a subject falls inside it. A scope always names
      the subjects it covers. An evaluation without a scope asserts no applicability
      beyond its focal subject.
    from_schema: https://framework.regen.network/schema/
    slots:
    - appliesTo
    - exclusion
    - limitation
    slot_usage:
      appliesTo:
        name: appliesTo
        required: true
        minimum_cardinality: 1
    attributes:
      appliesTo:
        name: appliesTo
        description: Identifiers of the subjects the judgment covers, for example
          the enrolment cohorts an approval is limited to. Unordered set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:appliesTo
        list_elements_ordered: false
        owner: Scope
        domain_of:
        - Scope
        range: uriorcurie
        required: true
        multivalued: true
        minimum_cardinality: 1
      exclusion:
        name: exclusion
        description: What the judgment explicitly does not cover. Unordered set.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:exclusion
        list_elements_ordered: false
        owner: Scope
        domain_of:
        - Scope
        range: string
        multivalued: true
      limitation:
        name: limitation
        description: What the judgment is not, for example that an approval of a project
          structure is not a validation of its evidence.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:limitation
        owner: Scope
        domain_of:
        - Scope
        range: string
    class_uri: rfs:Scope
  RegistryReviewEvaluation:
    name: RegistryReviewEvaluation
    description: 'What every judgment made in a Regen Registry review records, by
      the Registry Agent, an independent verifier (VVB) or the Credit Class Admin:
      the capacity in which the issuer acted, any conditions, and the method used.
      An evaluation records a judgment; it is neither the state of the review workflow
      nor the Registry''s institutional decision, such as approving a project''s registration,
      which it may inform.'
    comments:
    - 'Implementation: a mixin, declared by each Registry kind (RegistryRequirementEvaluation,
      RegistryFindingEvaluation, RegistryReportEvaluation), because a requirement
      evaluation already has RequirementEvaluation as its parent. It is not an entry
      point.'
    from_schema: https://framework.regen.network/schema/
    mixin: true
    slots:
    - issuerRole
    - conditions
    slot_usage:
      issuerRole:
        name: issuerRole
        required: true
      evaluationMethod:
        name: evaluationMethod
        description: 'The procedures the reviewer used. Required on a Registry review:
          every review states how it was carried out.'
        required: true
        minimum_cardinality: 1
    attributes:
      issuerRole:
        name: issuerRole
        description: The capacity in which the issuer is recorded as acting for this
          judgment. This value does not by itself establish the issuer's authority
          to act in that capacity.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:issuerRole
        owner: RegistryReviewEvaluation
        domain_of:
        - RegistryReviewEvaluation
        range: IssuerRole
        required: true
      conditions:
        name: conditions
