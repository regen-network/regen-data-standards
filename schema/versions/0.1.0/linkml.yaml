        name: appliesRequirement
        description: The exact Requirement version whose applicability to the subject
          and, when applicable, satisfaction are assessed by this Evaluation.
        from_schema: https://framework.regen.network/schema/
        slot_uri: rfs:appliesRequirement
        list_elements_ordered: false
        owner: RegistryRequirementEvaluation
        domain_of:
        - Evaluation
        range: uriorcurie
        required: true
        multivalued: true
        minimum_cardinality: 1
        maximum_cardinality: 1
