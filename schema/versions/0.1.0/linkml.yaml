    - CreditProtocol
    - Methodology
    - Registry
    - CreditClassInfo
    - Entity
    - Claim
    range: uri
  identifier:
    name: identifier
    description: Unique identifier for the resource / entity.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:identifier
    domain_of:
    - ReferenceId
    - CreditingProgram
    - CreditProtocol
    - Methodology
  version:
    name: version
    description: Version number of the resource / entity.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:version
    domain_of:
    - VersionedLink
    - CreditingProgram
    - CreditProtocol
    - Methodology
  image:
    name: image
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:image
    domain_of:
    - Entity
  projectStartDate:
    name: projectStartDate
    description: The start date of the project.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:startDate
    domain_of:
    - ProjectInfo
  projectEndDate:
    name: projectEndDate
    description: The end date of the project.
    from_schema: https://framework.regen.network/schema/
    slot_uri: schema:endDate
    domain_of:
    - ProjectInfo
  asWKT:
    name: asWKT
    description: A WKT literal with an optional CRS prefix (e.g., '<http://www.opengis.net/def/crs/EPSG/0/4326>
      POINT(...)').
    from_schema: https://framework.regen.network/schema/
    slot_uri: geo:asWKT
    domain_of:
    - Geometry
    range: string
  hasGeometry:
    name: hasGeometry
    from_schema: https://framework.regen.network/schema/
    slot_uri: geo:hasGeometry
    domain_of:
    - Feature
    range: Geometry
  hasBoundingBox:
    name: hasBoundingBox
    description: A derived geometry representing the bounding box of the geometry
      or feature.
    from_schema: https://framework.regen.network/schema/
    slot_uri: geo:hasBoundingBox
    domain_of:
    - Feature
    range: Geometry
  hasCentroid:
    name: hasCentroid
    description: A derived geometry representing the centroid of the feature.
    from_schema: https://framework.regen.network/schema/
    slot_uri: geo:hasCentroid
    domain_of:
    - Feature
    range: Geometry
  wasAttributedTo:
    name: wasAttributedTo
    description: 'PROV attribution: the ascribing of an entity to an agent. PROV infers
      that the agent was associated with an activity that generated the entity. Declared
      here so that narrower attribution relations, such as hasClaimant, can specialize
      it (rdfs:subPropertyOf) instead of redefining its meaning. Every value of a
      specializing slot therefore implies this relation; the reverse does not hold.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: prov:wasAttributedTo
    list_elements_ordered: false
    range: Entity
    multivalued: true
    inlined: true
    inlined_as_list: true
  wasAssociatedWith:
    name: wasAssociatedWith
    description: 'Responsibility of an agent for an activity (PROV). Use it only on
      a class that represents an activity (its PROV domain is prov:Activity); such
      classes declare the ProvActivity mixin. Not used by the base Claim: it is provided
      for specialized claim schemas, such as a CarbonEg claim schema, to name the
      operator of the domain activity they describe, for example a restoration activity.
      It is not attribution of the Claim: the operator and the claimant may differ,
      and when they coincide both relations are still stated.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: prov:wasAssociatedWith
    list_elements_ordered: false
    range: Entity
    multivalued: true
    inlined: true
    inlined_as_list: true
  wasRevisionOf:
    name: wasRevisionOf
    description: Identifier of the exact, immutable earlier version this resource
      revises (a PROV revision, itself a derivation, so do not also state prov:wasDerivedFrom
      for it). PROV infers that the two versions are aspects of the same thing (alternateOf);
      a resource that merely builds on another is not its revision. It must name one
      version, never a logical or version-family identifier. Stating a revision neither
      makes this version current nor carries over any attestation of the earlier one;
      which version an application accepts is maintained outside the resource.
    from_schema: https://framework.regen.network/schema/
    slot_uri: prov:wasRevisionOf
    domain_of:
    - Claim
    range: uriorcurie
  references:
    name: references
    description: 'Dublin Core citation: a resource the described resource references,
      cites or otherwise points to. Declared here so that narrower relations, such
      as hasEvidence, can specialize it (rdfs:subPropertyOf); a citation alone asserts
      neither derivation nor support. Unordered set.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: dcterms:references
    list_elements_ordered: false
    range: uriorcurie
    multivalued: true
  hasEvidence:
    name: hasEvidence
    description: Sources the claimant presents as evidence for the assertion, each
      an Evidence node identified by the IRI of the exact version cited. Whether a
      source actually supports the assertion is judged separately, by attestations.
      Specializes dcterms:references. Unordered set.
    from_schema: https://framework.regen.network/schema/
    is_a: references
    slot_uri: rfs:hasEvidence
    list_elements_ordered: false
    domain_of:
    - Claim
    range: Evidence
    multivalued: true
    inlined: true
    inlined_as_list: true
  hasClaimType:
    name: hasClaimType
    description: 'Subject-matter classification of what is asserted, drawn from the
      ClaimType taxonomy. It classifies content only: it does not declare which schema
      or schema version the document conforms to, and it does not by itself select
      a verification pathway.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:hasClaimType
    domain_of:
    - Claim
    range: ClaimType
    required: true
  hasClaimant:
    name: hasClaimant
    description: 'The agent or agents that take responsibility for making this assertion:
      an individual, organization or community. Each listed claimant takes responsibility
      for the whole assertion. A collective that asserts as one body is a single claimant
      of type COMMUNITY or ORGANIZATION; listing it does not make its members co-claimants.
      A service that extracted, generated or submitted the RDF is not a claimant unless
      it asserts the content itself. Specializes prov:wasAttributedTo, so under PROV
      each claimant is an agent associated with the activity that generated the Claim,
      which is the act of asserting. Unordered set.'
    from_schema: https://framework.regen.network/schema/
    is_a: wasAttributedTo
    slot_uri: rfs:hasClaimant
    list_elements_ordered: false
    domain_of:
    - Claim
    range: Entity
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  assertedAt:
    name: assertedAt
    description: When the claimants made this assertion. For an assertion they made
      in a source document, such as a project plan, and that was transcribed later,
      it is when they made it there, not when it was extracted, transcribed or submitted.
      It is never the time of an observation, or the time the Claim record was generated,
      submitted, published or ingested. The same content asserted at a different time
      is a different Claim. Written in UTC with whole seconds, in the XSD canonical
      form, for example 2026-05-02T07:30:00Z. A local offset is not accepted.
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:assertedAt
    domain_of:
    - Claim
    range: datetime
    required: true
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  hasSubject:
    name: hasSubject
    description: 'What the claim is about, as a ClaimSubject node identified by its
      IRI: a place, plot, project, organization, community, indicator, dataset or
      another claim. Claims about the same subject share its IRI and can be joined.
      Specialized claim schemas narrow the range to a subclass of ClaimSubject. Not
      the claimant, and not necessarily the feature of interest of an observation
      inside the claim.'
    from_schema: https://framework.regen.network/schema/
    slot_uri: rfs:hasSubject
    domain_of:
    - Claim
    range: ClaimSubject
    required: true
    inlined: true
