# Synthetic example (example.org identifiers): a base-layer evidence evaluation.
# A community steward assesses the planting log and walkover photographs
# together, against the generic hedgerow claim (GenericClaim-001): they support
# it, but are not enough to establish it. The claim identifier is a labelled
# placeholder for its ClaimIRI (regen-network/claims#1).
name: Steward assessment of the plot A hedgerow evidence
claimStatement: >-
  The planting log and the June walkover photographs support the claim that
