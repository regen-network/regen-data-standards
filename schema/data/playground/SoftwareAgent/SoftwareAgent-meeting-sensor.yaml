# Synthetic example (example.org identifiers, and a minted agent rid): the
# meeting sensor across its versions. Each version that runs has its own
# record, such as SoftwareAgent-meeting-sensor-1.4.2.yaml, which names this
# agent by its rid with isVersionOf.
rid: https://framework.regen.network/agent/01M728VMAYDB1VJ4EQSJ7AD4GJ
name: Example Meeting Sensor
type: prov:SoftwareAgent
description: >-
  Fetches the transcript and the calendar entry of a meeting as Evidence
  records.
