# Synthetic example (example.org identifiers): version 1.4.2 of the meeting
# sensor, the agent of the capture in Capture/. A new version is a new record,
# so this one never changes. It names the sensor across its versions
# (SoftwareAgent-meeting-sensor.yaml) by IRI with isVersionOf.
name: Example Meeting Sensor 1.4.2
type: prov:SoftwareAgent
softwareVersion: "1.4.2"
isVersionOf: https://example.org/sensors/meeting-sensor
