# Synthetic example (example.org identifiers): a project developer's claim about
# a whole aggregate project, as asserted in one project plan version. The rule
# sets it applies are exact versions; the requested deviation's approval is a
# separate evaluation. It cites two passages of the same plan as two citations
# of one Evidence record.
name: Example project P-001 design
claimStatement: >-
  Example project P-001 is an aggregate soil-carbon project of sites enrolled
  from 2020 to 2023, started on 1 March 2020.
assertedBy:
  - name: Example Soil Carbon Developer
    type: ORGANIZATION
assertedAt: "2026-02-20T00:00:00+00:00"
hasSubject:
  id: https://example.org/c06/project/P-001
  name: Example project P-001
appliesRuleSet:
  - https://example.org/rule-set/credit-class-c06/1.5.2
  - https://example.org/rule-set/program-guide/1.1
methodologyUse:
  - methodology: https://example.org/methodology/soil-organic-carbon/1.2.4
    methodologyRole: PRIMARY
    methodologyScope: Soil organic carbon stock change quantification
  - methodology: https://example.org/methodology/agricultural-land-management/2.1
    methodologyRole: SUPPLEMENTARY
    methodologyScope: Baseline, additionality and leakage assessment
isAggregateProject: true
aggregateStartDate: "2020-03-01"
startDateBasis: First baseline soil sampling
adoptionDate: "2020-03-01"
creditingPeriod:
  startDate: "2020-03-01"
  endDate: "2034-02-28"
permanencePeriod:
  startDate: "2030-03-01"
  endDate: "2044-02-28"
requestedDeviations:
  - addressesRequirement:
      - https://example.org/rule-set/credit-class-c06/registration-checklist/2026-05/ML-020
    replacedParameters: >-
      A three-year historical lookback and a 5% productivity-decline trigger
      instead of a five-year rolling average and a 10% trigger.
    justification: >-
      Aligns the leakage assessment with the supplementary methodology used for
      the baseline.
hasEvidence:
  - https://example.org/c06/project-plan-v2.0.pdf
hasEvidenceCitation:
  - source: https://example.org/c06/project-plan-v2.0.pdf
    selector:
      - selectorType: oa:FragmentSelector
        value: page=8
        conformsTo: http://tools.ietf.org/rfc/rfc3778
  - source: https://example.org/c06/project-plan-v2.0.pdf
    selector:
      - selectorType: oa:FragmentSelector
        value: page=16
        conformsTo: http://tools.ietf.org/rfc/rfc3778
