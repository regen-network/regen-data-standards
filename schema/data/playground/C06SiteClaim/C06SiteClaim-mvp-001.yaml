# Synthetic example (example.org identifiers): a project developer's claim about
# one site of an aggregate soil-carbon project, as asserted in a project plan
# version. Values reviewers check are fields of the claim; the site subject only
# identifies and places the site. The historic activity records are evidence,
# generated by the field operations they document.
name: Site S-001 start date, crediting period and practices
claimStatement: >-
  Site S-001 started on 15 March 2022, with its first baseline soil sampling,
  and has a ten-year crediting period. It is cropland under no-till and cover
  cropping, with activity records from 2019.
assertedBy:
  - name: Example Soil Carbon Developer
    type: ORGANIZATION
assertedAt: "2026-07-10T00:00:00+00:00"
hasSubject:
  id: https://example.org/c06/site/S-001
  name: Site S-001
  siteKey: S-001
  country: CZ
  project: https://example.org/c06/project/P-001
  cohort: https://example.org/c06/cohort/P-001-2022
siteProjectStartDate: "2022-03-15"
startDateBasis: First baseline soil sampling
creditingPeriod:
  startDate: "2022-03-15"
  endDate: "2032-03-14"
ecosystemTypes:
  - CROPLAND
climateClass: Dfb
soilGroup: Cambisol
practices:
  - COVER_CROPPING
  - RESIDUE_TILLAGE_MANAGEMENT
primaryLandUse: CROPLAND
monitoringSampleDates:
  - "2022-03-15"
  - "2024-04-02"
hasEvidence:
  - https://example.org/c06/project-plan-v2.1.pdf
  - https://example.org/c06/exports/soil-sampling-2026-05.csv
  - https://example.org/c06/exports/field-records-S-001-2019-2021.csv
hasEvidenceCitation:
  - source: https://example.org/c06/project-plan-v2.1.pdf
    selector:
      - selectorType: oa:FragmentSelector
        value: page=16
        conformsTo: http://tools.ietf.org/rfc/rfc3778
        refinedBy:
          - selectorType: oa:TextQuoteSelector
            exact: 1.8 Project Start Date
