id: https://framework.regen.network/schema/Attestation
name: Attestation
description: >-
  The base Attestation: an issuer's dated, scoped judgment about claims or
  other attestations. It holds only what every program's judgments share;
  program-specific review vocabularies, such as Regen Registry's, extend it
  with is_a Attestation. See docs/attestation-and-evidence.md.
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/

imports:
  - linkml:types
  - core
  - Claim
  - ClaimVocabulary

default_prefix: rfs
default_range: string

classes:
  Attestation:
    is_a: Claim
    class_uri: rfs:Attestation
    description: >-
      An issuer's judgment, made at a stated time, about what it targets:
      exact versions of claims, of other attestations, or a snapshot of
      claims. As a Claim it is attributed (hasClaimant names the issuer),
      immutable and revisable with wasRevisionOf; it is about a subject, such
      as a project or a plot, even when it judges a claim about that subject.
      It does not carry its own hash or IRI, anchoring state, or a status
      that changes after it is made: a later judgment is a new Attestation.
    slots:
      - hasTarget
      - reliesOn
      - requirement
      - appliesRuleSet
      - outcome
      - rationale
      - verificationMethod
      - verificationMethodDescriptor
      - scope
    slot_usage:
      hasClaimant:
        description: >-
          The issuer: the party that makes the judgment and takes
          responsibility for it.
      assertedAt:
        description: When the issuer made the judgment.
      hasSubject:
        description: >-
          What the judgment is about: a project, plot or other subject. It is
          stated even when it is also the subject of a targeted claim.
      hasEvidence:
        description: Sources the issuer relied on.
      verificationMethod:
        required: true
    rules:
      - description: >-
          A verification method outside the enumeration is described, so the
          method is never empty (story map CS-4). Enforced by the generated
          JSON Schema; the generated SHACL does not express LinkML rules.
        preconditions:
          slot_conditions:
            verificationMethod:
              equals_string: OTHER
        postconditions:
          slot_conditions:
            verificationMethodDescriptor:
              required: true

  Scope:
    class_uri: rfs:Scope
    description: >-
      Where an attestation applies, as structured fields, so that a consumer
      can check whether a subject falls inside it. An attestation without a
      scope applies only to what it targets.
    slots:
      - appliesTo
      - exclusion
      - limitation
      - unbounded

slots:
  outcome:
    slot_uri: rfs:outcome
    description: >-
      The verdict, as a term from the vocabulary of the program or rule set
      the judgment is made under, for example a registration determination.
    range: uriorcurie
  rationale:
    slot_uri: rfs:rationale
    description: Why the issuer reached the outcome.
    range: string
  scope:
    slot_uri: rfs:scope
    range: Scope
    inlined: true
  appliesTo:
    slot_uri: rfs:appliesTo
    description: >-
      Identifiers of the subjects the judgment covers, for example the
      enrolment cohorts an approval is limited to. Unordered set.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  exclusion:
    slot_uri: rfs:exclusion
    description: What the judgment explicitly does not cover. Unordered set.
    range: string
    multivalued: true
    list_elements_ordered: false
  limitation:
    slot_uri: rfs:limitation
    description: >-
      What the judgment is not, for example that an approval of a project
      structure is not a validation of its evidence.
    range: string
  unbounded:
    slot_uri: rfs:unbounded
    description: >-
      True when the issuer explicitly gives the judgment no scope limits, so
      that an unscoped approval is a stated choice rather than an omission.
    range: boolean
