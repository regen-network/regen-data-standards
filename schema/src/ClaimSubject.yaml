id: ClaimSubject
name: ClaimSubject
description: >-
  Skeleton of what a Claim is about. It gives every claim subject a typed,
  identified node, so subjects can be queried and validated instead of being
  bare IRIs. Specialized claim schemas define the kinds of subject they need as
  subclasses (for example Plot is_a ClaimSubject) and add their fields there.
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/
  schema: http://schema.org/

imports:
  - linkml:types
  - core

default_prefix: rfs
default_range: string

classes:
  ClaimSubject:
    class_uri: rfs:ClaimSubject
    description: >-
      What a Claim is about: a place, plot, project, organization, community,
      indicator, dataset or another claim, identified by an IRI so that claims
      about the same subject can be joined. In a Claim the node carries only
      the subject's IRI and its type, the class a claim type's hasSubject
      range names, so that the range can be checked in one document. Its
      name and full description live on its own resource, not in each Claim
      about it: otherwise every Claim would state its own name for the
      subject, and the names would merge on the subject's IRI.
    attributes:
      id:
        identifier: true
        range: uriorcurie
        description: IRI or CURIE of the subject, for example https://example.org/plot/A.
