id: https://framework.regen.network/schema/
name: Schemas
version: 0.1.0
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/
  rft: https://framework.regen.network/taxonomy/
  schema: http://schema.org/
  qudt: http://qudt.org/schema/qudt/
  unit: http://qudt.org/vocab/unit/
  dcmitype: http://purl.org/dc/dcmitype/
  geo: http://www.opengis.net/ont/geosparql#
  # Not "sdg": LinkML's generated Python names a prefix's namespace after it in
  # capitals, which would clash with the SDG enum.
  sdgs: https://sdgs.un.org/goals/
imports:
  - linkml:types
  - core
  - taxonomy
  - ProjectInfo
  - ProjectPost
  - SDG
  - Impact
  - CreditingProgram
  - CreditProtocol
  - Methodology
  - Registry
  - CreditClassInfo
  - Claim
  - ClaimSubject
  - Evidence
  - Activity
  - ClaimVocabulary
  - ProvAlignment
  - Attestation
  - RegistryReviewAttestation
  - C06Claim
  - BT01ProjectInfo
  - C01ProjectInfo
  - C02ProjectInfo
default_curi_maps:
  - semweb_context
default_prefix: rfs
default_range: string
