id: https://framework.regen.network/schema/Evidence
name: Evidence
description: >-
  The evidence a Claim or Evaluation cites. An Evidence record describes one
  exact version of a source once: where its bytes can be fetched, the hash
  that lets a reader check them, and the usage terms that applied to that
  version. A Claim references it by IRI, and an EvidenceCitation says where
  inside it the cited material is, using Web Annotation selectors. Current
  availability, access and the currently offered licence are not recorded
  here: they change after the citation and are reported by the resolver.
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/
  schema: http://schema.org/
  dcterms: http://purl.org/dc/terms/
  dcmitype: http://purl.org/dc/dcmitype/
  prov: http://www.w3.org/ns/prov#
  oa: http://www.w3.org/ns/oa#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#

imports:
  - linkml:types
  - core
  - Activity
  - ProvAlignment

default_prefix: rfs
default_range: string

classes:
  Evidence:
    class_uri: rfs:Evidence
    mixins:
      - ProvEntity
    description: >-
      A source cited as evidence: a document, dataset, record or observation,
      identified by the IRI of the exact version cited. The IRI identifies
      the whole source, never a position inside it: positions are on the
      citation, so the same source cited at several places stays one
      resource with one hash. A record is its own document, which claims and
      evaluations reference by IRI. Whether it actually supports a claim is
      judged separately, by evaluations, and its current availability or
      access is not recorded here.
    slots:
      - name
      - description
      - sourceType
      - mediaType
      - contentHash
      - resolver
      - licence
      - issued
      - wasGeneratedBy
    slot_usage:
      name:
        description: Title of the cited source.
      description:
        description: What the source is, in the citer's words.
    attributes:
      id:
        identifier: true
        range: uriorcurie
        pattern: "^[^#]*$"
        description: >-
          IRI or CURIE of the exact source version cited, without a fragment,
          for example https://example.org/project-plan-v2.pdf. A position
          inside the source, such as a page, is a selector on the citation.

  EvidenceCitation:
    class_uri: rfs:EvidenceCitation
    broad_mappings:
      - oa:ResourceSelection
    description: >-
      Where inside one cited source the material a claim relies on is: a
      local profile of a Web Annotation resource selection, with exactly one
      source and zero or more selectors. Without a selector the whole source
      is cited. Several selectors are alternative ways to locate the same
      passage; distinct passages of one source are separate citations.
      Changing a selector changes the citation, and so the citing record's
      content, but never the source's IRI or hash.
    slots:
      - source
      - selector
    slot_usage:
      source:
        required: true

  Selector:
    class_uri: oa:Selector
    abstract: true
    description: >-
      Web Annotation selector: how to locate a segment of the source. Its
      kind is stated with selectorType.
    slots:
      - selectorType
      - refinedBy

  FragmentSelector:
    is_a: Selector
    class_uri: oa:FragmentSelector
    description: >-
      Locates a segment with a fragment identifier, such as page=16, in the
      syntax conformsTo names, for example RFC 3778 for PDF pages.
    slots:
      - value
      - conformsTo
    slot_usage:
      value:
        required: true

  TextQuoteSelector:
    is_a: Selector
    class_uri: oa:TextQuoteSelector
    description: >-
      Locates a passage by quoting it exactly, with the text just before and
      after it to tell repeated passages apart. Used only when the quotation
      itself locates the passage; a display excerpt, translation or
      paraphrase is not a selector.
    slots:
      - exact
      - prefix
      - suffix
    slot_usage:
      exact:
        required: true

  ContentDigest:
    class_uri: rfs:ContentDigest
    description: >-
      A cryptographic hash of the bytes of the cited source version: the whole
      file, not a passage a citation selects. A reader recomputes it over
      the bytes the resolver returns to check that they are the bytes cited.
    attributes:
      algorithm:
        slot_uri: rfs:algorithm
        range: DigestAlgorithm
        required: true
      digestValue:
        slot_uri: rfs:digestValue
        description: Lowercase hexadecimal digest.
        range: string
        pattern: "^[0-9a-f]{64}$"
        required: true

slots:
  sourceType:
    slot_uri: dcterms:type
    description: >-
      Genre of the cited source, from the DCMI Type Vocabulary, which the
      dcterms:type definition recommends. Finer kinds of evidence that a
      program accepts, such as a lease agreement, belong to that program's
      rule set, not to Evidence.
    range: DCMIType
    required: true
  mediaType:
    slot_uri: dcterms:format
    description: Media type of the source, for example application/pdf.
    range: string
  contentHash:
    slot_uri: rfs:contentHash
    description: >-
      Hash of the bytes of the cited source version. This is the hash of the
      source, which a citation needs; it is not the hash of the Claim or
      Evaluation that cites it, which is never part of its own content.
    range: ContentDigest
    inlined: true
    required: true
  resolver:
    slot_uri: rfs:resolver
    description: >-
      Where the bytes of the cited version can be fetched. The data can stay
      where its owner keeps it; the claim stores only the hash and the
      resolver. Unordered set.
    range: uri
    multivalued: true
    list_elements_ordered: false
    required: true
    minimum_cardinality: 1
  licence:
    slot_uri: dcterms:license
    description: >-
      IRI of the licence document or versioned licence terms in effect for
      this version of the source. When absent, the terms must be read as
      "unspecified — all rights reserved" (rfs:UnspecifiedAllRightsReserved),
      never as unrestricted.
    range: uri
  issued:
    slot_uri: dcterms:issued
    description: Date of the cited version of the source.
    range: date
  wasGeneratedBy:
    slot_uri: prov:wasGeneratedBy
    description: >-
      The activity that produced the cited source, with its period and who
      carried it out: for example the soil sampling behind a results file, or
      the field operations a farm management record documents. When the
      evidence was produced is the activity's period, not a field of Evidence,
      because PROV-O declares activities and entities disjoint. Evidence
      produced by the same activity names the same activity IRI.
    range: Activity
    inlined: true

  source:
    slot_uri: oa:hasSource
    description: >-
      The cited source: the IRI of an Evidence record, which the citing
      record also lists in hasEvidence.
    range: Evidence
    inlined: false
  selector:
    slot_uri: oa:hasSelector
    description: >-
      How to locate the cited segment of the source. Several selectors are
      alternatives that locate the same segment. Unordered set.
    range: Selector
    any_of:
      - range: FragmentSelector
      - range: TextQuoteSelector
    inlined: true
    inlined_as_list: true
    multivalued: true
    list_elements_ordered: false
  selectorType:
    slot_uri: rdf:type
    designates_type: true
    description: >-
      The kind of selector, as a CURIE: oa:FragmentSelector or
      oa:TextQuoteSelector.
    range: uriorcurie
    required: true
  refinedBy:
    slot_uri: oa:refinedBy
    description: >-
      A selector applied to the segment this one selects, for example a
      quotation within a page. Several are alternatives with the same result.
      Unordered set.
    range: Selector
    any_of:
      - range: FragmentSelector
      - range: TextQuoteSelector
    inlined: true
    inlined_as_list: true
    multivalued: true
    list_elements_ordered: false
  value:
    slot_uri: rdf:value
    description: The fragment identifier, without the leading "#", such as page=16.
    range: string
  conformsTo:
    slot_uri: dcterms:conformsTo
    description: >-
      The specification of the fragment syntax, for example
      http://tools.ietf.org/rfc/rfc3778 for PDF or
      http://www.w3.org/TR/media-frags/ for audio and video.
    range: uri
  exact:
    slot_uri: oa:exact
    description: The exact text of the passage.
    range: string
  prefix:
    slot_uri: oa:prefix
    description: Text immediately before the passage.
    range: string
  suffix:
    slot_uri: oa:suffix
    description: Text immediately after the passage.
    range: string

enums:
  DCMIType:
    description: The DCMI Type Vocabulary.
    permissible_values:
      COLLECTION:
        meaning: http://purl.org/dc/dcmitype/Collection
      DATASET:
        meaning: http://purl.org/dc/dcmitype/Dataset
      EVENT:
        meaning: http://purl.org/dc/dcmitype/Event
      IMAGE:
        meaning: http://purl.org/dc/dcmitype/Image
      INTERACTIVE_RESOURCE:
        meaning: http://purl.org/dc/dcmitype/InteractiveResource
      MOVING_IMAGE:
        meaning: http://purl.org/dc/dcmitype/MovingImage
      PHYSICAL_OBJECT:
        meaning: http://purl.org/dc/dcmitype/PhysicalObject
      SERVICE:
        meaning: http://purl.org/dc/dcmitype/Service
      SOFTWARE:
        meaning: http://purl.org/dc/dcmitype/Software
      SOUND:
        meaning: http://purl.org/dc/dcmitype/Sound
      STILL_IMAGE:
        meaning: http://purl.org/dc/dcmitype/StillImage
      TEXT:
        meaning: http://purl.org/dc/dcmitype/Text
  DigestAlgorithm:
    permissible_values:
      SHA_256:
        meaning: rfs:SHA256
        description: SHA-256.
      BLAKE2B_256:
        meaning: rfs:BLAKE2b256
        description: BLAKE2b with a 256-bit digest.
  EvidenceCheckOutcome:
    description: >-
      Outcomes a resolver reports when a consumer fetches cited evidence. They
      are reported at a point in time and are never stored in Claim or
      Evaluation content.
    permissible_values:
      EVIDENCE_INTACT:
        meaning: rfs:EvidenceIntact
        description: The fetched bytes match the cited contentHash.
      EVIDENCE_ALTERED:
        meaning: rfs:EvidenceAltered
        description: The fetched bytes do not match; the report names both hashes.
      UNREACHABLE:
        meaning: rfs:EvidenceUnreachable
        description: The resolver did not answer. The citing claim still resolves.
      ACCESS_RESTRICTED:
        meaning: rfs:EvidenceAccessRestricted
        description: The resolver refused access. Never reported as missing.
