id: https://framework.regen.network/schema/core
name: Core

prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/
  qudt: http://qudt.org/schema/qudt/

default_prefix: rfs

imports:
  - linkml:types

slots:
  name:
    slot_uri: schema:name
    description: Name of the entity / resource.
    rank: 1
  description:
    slot_uri: schema:description
    description: Description of the entity / resource.
    rank: 1
  url:
    slot_uri: schema:url
    description: Link to a valid URL where more information can be found about the entity / resource.
    range: uri
    rank: 1
  identifier:
    slot_uri: schema:identifier
    description: Unique identifier for the resource / entity.
  version:
    slot_uri: schema:version
    description: Version number of the resource / entity.
  image:
    slot_uri: schema:image

classes:
  Link:
    slots:
      - name
      - url
      - description
    slot_usage:
      name:
        required: true
      url:
        required: true
  VersionedLink:
    is_a: Link
    slots:
      - version
    slot_usage:
      name:
        required: true
  QuantityValue:
    class_uri: qudt:QuantityValue
    description: >-
      A value that represents a quantity, with a numeric value and the unit
      it is expressed in, as a QUDT quantity value.
    attributes:
      numericValue:
        slot_uri: qudt:value
        range: float
        description: The numeric value of the quantity.
      unit:
        slot_uri: qudt:hasUnit
        range: uriorcurie
        description: >-
          IRI of the unit in the QUDT unit vocabulary
          (http://qudt.org/vocab/unit/), for example
          http://qudt.org/vocab/unit/HA (hectare). In JSON-LD, write the full
          IRI: the term unit, which is this slot, shadows a unit: prefix, so
          unit:HA would not expand.

types:
  duration:
    uri: xsd:duration
    base: str
    description: "ISO 8601 duration format (e.g., P1Y2M, PT15M, P30D)"
    exact_mappings:
      - schema:Duration
