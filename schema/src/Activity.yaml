id: https://framework.regen.network/schema/Activity
name: Activity
description: >-
  A PROV activity: something that took place over a period and that agents
  were responsible for, such as the soil sampling or the field operations that
  produced a piece of evidence, or a sensor's capture of a source. An activity
  is a record of its own, which Evidence names by IRI with wasGeneratedBy; the
  activity states when it took place and who carried it out. See
  docs/evaluation-and-evidence.md.
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/
  prov: http://www.w3.org/ns/prov#
  schema: http://schema.org/

imports:
  - linkml:types
  - core
  - Agent
  - ProvAlignment

default_prefix: rfs
default_range: string

classes:
  Activity:
    abstract: true
    class_uri: rfs:Activity
    mixins:
      - ProvActivity
    description: >-
      Something that took place over a period, identified by an IRI so that
      every piece of evidence it generated names the same activity. An
      activity is a record of its own: Evidence names it by IRI and never
      inlines it, so one activity that generated several records is described
      once. Abstract: a record is a GenericActivity or a Capture.
    slots:
      - name
      - description
      - wasAssociatedWith
    attributes:
      id:
        identifier: true
        range: uriorcurie
        description: IRI of the activity.

  GenericActivity:
    is_a: Activity
    class_uri: rfs:GenericActivity
    description: >-
      An activity behind the content of a source, such as the soil sampling
      behind a results file or the field operations a farm management record
      documents, with its period as dates.
    comments:
      - >-
        Implementation: it exists as its own class so that such an activity
        is validated with a closed shape, which the open Activity base cannot
        give its direct instances, as GenericClaim does for Claim.
    slots:
      - startDate
      - endDate

  Capture:
    is_a: Activity
    class_uri: rfs:Capture
    description: >-
      A sensor or tool fetching an exact version of an upstream record, such
      as a meeting transcript or a spreadsheet export. The Evidence it
      generates is that version; the record it fetched is the one it used.
      Captures of the same upstream record name the same IRI in used, so the
      latest capture of a record is the one with the latest endedAtTime. The
      sensor that ran is named in wasAssociatedWith by the SoftwareAgent
      record for its version.
    slots:
      - used
      - startedAtTime
      - endedAtTime
    slot_usage:
      used:
        required: true
      endedAtTime:
        required: true

slots:
  wasAssociatedWith:
    slot_uri: prov:wasAssociatedWith
    description: >-
      Responsibility of an agent for an activity (PROV), for example the farm
      operator who carried out the field operations a record documents, or
      the sensor, a SoftwareAgent, that ran a capture. Claim-type schemas
      that describe a domain activity, such as a restoration, name its
      operator the same way. Use it only on a class that
      represents an activity (its PROV domain is prov:Activity); such classes
      declare the ProvActivity mixin. It is not attribution of a Claim: the
      operator and the claimant may differ, and when they coincide both
      relations are still stated. Unordered set.
    range: Agent
    any_of:
      - range: Person
      - range: Organization
      - range: SoftwareAgent
      - range: Community
    multivalued: true
    list_elements_ordered: false
    inlined: true
    inlined_as_list: true
  startDate:
    slot_uri: schema:startDate
    description: >-
      First day of the period, included.
    range: date
  endDate:
    slot_uri: schema:endDate
    description: >-
      Last day of the period, included.
    range: date
  used:
    slot_uri: prov:used
    description: >-
      The upstream record a capture fetched, by its stable IRI: the record
      itself, not the version captured, which is the Evidence the capture
      generated. For a source whose native identifier is not an IRI, such as
      a meeting identifier, it is the IRI of the record's landing page.
    range: uriorcurie
  startedAtTime:
    slot_uri: prov:startedAtTime
    description: >-
      When the capture started. Written in UTC with whole seconds and the
      offset +00:00, as assertedAt is.
    range: datetime
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\+00:00$"
  endedAtTime:
    slot_uri: prov:endedAtTime
    description: >-
      When the capture ended: the time the version it generated was fetched.
      Written in UTC with whole seconds and the offset +00:00, as assertedAt
      is.
    range: datetime
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\+00:00$"
