id: ProvAlignment
name: ProvAlignment
description: >-
  Mixins that declare which of our classes are PROV-O classes, so that the
  generated OWL states it (rdfs:subClassOf) without relying on inference from
  PROV-O property domains and ranges. They add no slots and do not change
  instance data. Note the naming: our Entity class is a PROV Agent (an
  individual, organization or community), while a Claim is a PROV Entity.
  Activity classes, which specialized claim schemas define, declare the
  ProvActivity mixin.
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/
  prov: http://www.w3.org/ns/prov#

imports:
  - linkml:types

default_prefix: rfs

classes:
  ProvEntity:
    class_uri: prov:Entity
    mixin: true
    description: >-
      PROV-O Entity: a thing with some fixed aspects, such as a Claim version.
  ProvAgent:
    class_uri: prov:Agent
    mixin: true
    description: >-
      PROV-O Agent: something that bears responsibility, such as a person,
      organization or community.
  ProvActivity:
    class_uri: prov:Activity
    mixin: true
    description: >-
      PROV-O Activity: something that occurs over a period of time, such as
      the domain activity a specialized claim describes (a planting, a
      restoration) or the activity that produced a piece of evidence (a
      survey, a lab analysis).
