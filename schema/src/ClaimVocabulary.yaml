id: https://framework.regen.network/schema/ClaimVocabulary
name: ClaimVocabulary
description: >-
  Shared terms that the base Claim and claim-type schemas import rather than
  restate: attribution, citation and revision relations reused from PROV-O and
  Dublin Core, and the language of a text. Importing this module does not make any class carry these
  slots; a class carries only the slots it lists. The PROV relations keep
  PROV-O's meaning, domains and ranges: a subject of wasAttributedTo or
  wasRevisionOf is a prov:Entity, and their agent values are prov:Agent. The
  activity-responsibility relation, wasAssociatedWith, is defined with the
  Activity class in Activity.yaml, which this module imports.
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/

imports:
  - linkml:types
  - core
  - Agent
  - Activity
  - Evidence

default_prefix: rfs
default_range: string

slots:
  wasAttributedTo:
    slot_uri: prov:wasAttributedTo
    description: >-
      PROV attribution: the ascribing of an entity to an agent. PROV infers
      that the agent was associated with an activity that generated the
      entity. Declared here so that narrower attribution relations, such as
      assertedBy, can specialize it (rdfs:subPropertyOf) instead of
      redefining its meaning. Every value of a specializing slot therefore
      implies this relation; the reverse does not hold.
    range: Agent
    any_of:
      - range: Person
      - range: Organization
      - range: SoftwareAgent
      - range: Community
    multivalued: true
    list_elements_ordered: false
    inlined: true
    inlined_as_list: true
  wasRevisionOf:
    slot_uri: prov:wasRevisionOf
    description: >-
      Identifier of the exact, immutable earlier version this resource revises
      (a PROV revision, itself a derivation, so do not also state
      prov:wasDerivedFrom for it). PROV infers that the two versions are
      aspects of the same thing (alternateOf); a resource that merely builds on
      another is not its revision. It must name one version, never a logical
      or version-family identifier. Stating a revision neither makes this
      version current nor carries over any evaluation of the earlier one;
      which version an application accepts is maintained outside the
      resource. The value is a bare IRI: this schema does not describe the
      earlier version, so the slot names no class.
    range: uriorcurie
  references:
    slot_uri: dcterms:references
    description: >-
      Dublin Core citation: a resource the described resource references,
      cites or otherwise points to. Declared here so that narrower relations,
      such as reliesOn, can specialize it (rdfs:subPropertyOf); a citation
      alone asserts neither derivation nor support. Each value is the IRI of
      the cited resource. A citation asserts nothing about that resource: its
      description, type and integrity information live on the resource
      itself, shaped by its own schema. Unordered set.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  hasEvidenceCitation:
    slot_uri: rfs:hasEvidenceCitation
    description: >-
      The evidence the claimant presents for the assertion, as citations.
      Each citation names one Evidence record by IRI (its source) and,
      optionally, selectors that locate the cited material inside it; a
      citation without selectors cites the whole source, and a source cited
      at several places has one citation per passage. The Evidence records
      are their own documents, described once and never inlined, and are
      reached through each citation's source. Whether the evidence supports
      the assertion is judged separately, by evaluations. Unordered set.
    range: EvidenceCitation
    inlined: true
    inlined_as_list: true
    multivalued: true
    list_elements_ordered: false
  reliesOn:
    is_a: references
    slot_uri: rfs:reliesOn
    description: >-
      An exact Claim or Evaluation whose asserted content or result is used
      in reaching this Evaluation's assessment, but which is not itself
      directly assessed by the Evaluation, for example the claim stating an
      enrolment cutoff that a confirmation relies on.
    comments:
      - >-
        Implementation: each value is the IRI of one immutable version, such
        as a ClaimIRI. Repeatable and unordered. Specializes
        dcterms:references, so it asserts neither derivation nor support.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  hasTarget:
    slot_uri: rfs:hasTarget
    description: >-
      The exact resource or resources directly examined or assessed in
      reaching the Evaluation's conclusion. When a resource can change, the
      target identifies the particular version or snapshot that was
      assessed. It is distinct from the Evaluation's focal subject
      (hasSubject) and from the criteria it applies (appliesRequirement).
    comments:
      - >-
        Implementation: each value is an IRI, never a logical identifier or
        label. Repeatable and unordered. The base slot does not restrict what
        kind of resource a target is; a kind of evaluation may require it or
        restrict it, as EvidenceSupportEvaluation does to Evidence records and
        ClaimConsistencyEvaluation to claim versions.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  appliesRequirement:
    slot_uri: rfs:appliesRequirement
    description: >-
      Exact requirement versions an evaluation applies or judges, whether or
      not the claimant named them. Each identifier names one immutable
      requirement version within an exact requirement-set version, such as a
      checklist version: the same short ID can name different requirements in
      different versions. The requirement and requirement-set records
      themselves are defined by WP5-01 (claims#30). Unordered set.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  addressesRequirement:
    slot_uri: rfs:addressesRequirement
    description: >-
      Exact requirement versions the claimant presents a Claim, or part of
      it, as responding to, identified as for appliesRequirement. It records
      the claimant's intent only: it implies neither that the requirement
      applies nor that it is met, conformed to or accepted, which an
      evaluation judges with appliesRequirement. Not on the base Claim: a
      claim type selects it where it needs it. Unordered set.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  appliesRequirementSet:
    slot_uri: rfs:appliesRequirementSet
    description: >-
      Exact versions of requirement sets, such as a registration or
      validation checklist version, that an evaluation applies or assesses as
      a whole. An evaluation of one requirement names only that requirement
      (appliesRequirement): its set is reached through the requirement's
      membership, defined by WP5-01 (claims#30).
    comments:
      - >-
        Implementation: each value is the IRI of one requirement-set version.
        Repeatable and unordered.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  governedBy:
    slot_uri: rfs:governedBy
    description: >-
      Exact versions of the governing documents a claim or evaluation is made
      under, such as a credit class, a methodology or a program guide
      version. A governing document is broader than a set of requirements,
      which is named with appliesRequirementSet. It is content and enters the
      identity of the record, and is distinct from a schema-version
      declaration, which states which schema the RDF conforms to.
    comments:
      - >-
        Implementation: each value is the IRI of one exact document version.
        Repeatable and unordered.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  evaluationMethod:
    slot_uri: rfs:evaluationMethod
    description: >-
      The procedures the evaluator used to reach the assessment, such as a
      document review or a site inspection. It is not who evaluated (that is
      assertedBy, and any role a program records) nor how the evidence was
      produced (that is the evidence's generating activity).
    comments:
      - >-
        Implementation: each value is the IRI of a method, so a method is
        defined once and reused, and another program can use its own terms.
        EvaluationMethodType lists the recommended shared methods by their
        meaning IRIs. Repeatable and unordered.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  evaluationMethodDescription:
    slot_uri: rfs:evaluationMethodDescription
    description: >-
      How the evaluator reached the assessment, in their words, for example
      which records were compared and how.
    comments:
      - >-
        Implementation: must contain a non-whitespace character, so an empty
        description is rejected rather than standing in for none.
    range: string
    pattern: "\\S"
enums:
  EvaluationMethodType:
    description: >-
      Recommended shared evaluation methods, used as evaluationMethod values
      by their meaning IRIs. A program may use other method IRIs, or narrow
      the methods it accepts.
    permissible_values:
      DOCUMENT_REVIEW:
        meaning: rfs:DocumentReview
        description: Review of submitted documents or records.
      SITE_INSPECTION:
        meaning: rfs:SiteInspection
        description: Inspection of the subject on site.
      RECORD_COMPARISON:
        meaning: rfs:RecordComparison
        description: Comparison of values across records or sources.
      RECALCULATION:
        meaning: rfs:Recalculation
        description: Independent recalculation of a reported value.
