id: https://framework.regen.network/schema/ClaimVocabulary
name: ClaimVocabulary
description: >-
  Shared terms that the base Claim and claim-type schemas import rather than
  restate: attribution, citation and revision relations reused from PROV-O and
  Dublin Core. Importing this module does not make any class carry these
  slots; a class carries only the slots it lists. The PROV relations keep
  PROV-O's meaning, domains and ranges: a subject of wasAttributedTo or
  wasRevisionOf is a prov:Entity, and their agent values are prov:Agent. The
  activity-responsibility relation, wasAssociatedWith, is defined with the
  Activity class in Activity.yaml, which this module imports.
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/

imports:
  - linkml:types
  - core
  - Entity
  - Activity
  - Evidence

default_prefix: rfs
default_range: string

slots:
  wasAttributedTo:
    slot_uri: prov:wasAttributedTo
    description: >-
      PROV attribution: the ascribing of an entity to an agent. PROV infers
      that the agent was associated with an activity that generated the
      entity. Declared here so that narrower attribution relations, such as
      hasClaimant, can specialize it (rdfs:subPropertyOf) instead of
      redefining its meaning. Every value of a specializing slot therefore
      implies this relation; the reverse does not hold.
    range: Entity
    multivalued: true
    list_elements_ordered: false
    inlined: true
    inlined_as_list: true
  wasRevisionOf:
    slot_uri: prov:wasRevisionOf
    description: >-
      Identifier of the exact, immutable earlier version this resource revises
      (a PROV revision, itself a derivation, so do not also state
      prov:wasDerivedFrom for it). PROV infers that the two versions are
      aspects of the same thing (alternateOf); a resource that merely builds on
      another is not its revision. It must name one version, never a logical
      or version-family identifier. Stating a revision neither makes this
      version current nor carries over any attestation of the earlier one;
      which version an application accepts is maintained outside the
      resource.
    range: uriorcurie
  references:
    slot_uri: dcterms:references
    description: >-
      Dublin Core citation: a resource the described resource references,
      cites or otherwise points to. Declared here so that narrower relations,
      such as hasEvidence, can specialize it (rdfs:subPropertyOf); a citation
      alone asserts neither derivation nor support. Unordered set.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  hasEvidence:
    is_a: references
    slot_uri: rfs:hasEvidence
    description: >-
      Sources the claimant presents as evidence for the assertion, each an
      Evidence node identified by the IRI of the exact version cited. Whether
      a source actually supports the assertion is judged separately, by
      attestations. Specializes dcterms:references. Unordered set.
    range: Evidence
    inlined: true
    inlined_as_list: true
    multivalued: true
    list_elements_ordered: false
  reliesOn:
    is_a: references
    slot_uri: rfs:reliesOn
    description: >-
      Exact versions of claims or attestations that a judgment depends on
      without judging them, for example the claim stating an enrolment cutoff
      that an approval relies on. Each value is the identifier of one
      immutable version. Specializes dcterms:references, so it asserts neither
      derivation nor support. Unordered set.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  hasTarget:
    slot_uri: rfs:hasTarget
    description: >-
      What an attestation judges or answers: the identifier of an exact,
      immutable version of a claim, of another attestation, or of a snapshot
      (a fixed set of claim versions). Never a logical identifier or label.
      Unordered set.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  requirement:
    slot_uri: rfs:requirement
    description: >-
      Identifier of a requirement within one version of a rule set or
      checklist, for example a credit class registration requirement. The
      identifier must name the checklist version as well as the requirement,
      because the same short ID can name different requirements in different
      versions. Unordered set.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  appliesRuleSet:
    slot_uri: rfs:appliesRuleSet
    description: >-
      Identifier of an exact version of a normative rule set applied, such as
      a credit class, a methodology or a program guide version. It is content
      and enters the identity of the record. It is distinct from a
      schema-version declaration, which states which schema the RDF conforms
      to. Unordered set.
    range: uriorcurie
    multivalued: true
    list_elements_ordered: false
  verificationMethod:
    slot_uri: rfs:verificationMethod
    description: >-
      How the assertion or judgment was established, as structured data, so
      that a consumer can distinguish, for example, a lab-measured value from
      a self-attested one. One method per record: its party and date are
      those of the record that carries it (for an attestation, its issuer and
      assertedAt), so a subject checked by two methods has two records, each
      with its own party and date. A value of OTHER must come with
      verificationMethodDescriptor.
    range: VerificationMethodType
  verificationMethodDescriptor:
    slot_uri: rfs:verificationMethodDescriptor
    description: >-
      Free-text description of a verification method that the
      VerificationMethodType enumeration does not cover; required when
      verificationMethod is OTHER. It is the extension path: a method that
      recurs is added to the enumeration in a later schema version.
    range: string

enums:
  VerificationMethodType:
    description: >-
      Kinds of verification method (story map CS-4). A program declares which
      methods it accepts; this enumeration does not rank them.
    permissible_values:
      SELF_ATTESTED:
        meaning: rfs:SelfAttested
        description: Asserted by the claimant without independent verification.
      PEER_OR_COMMUNITY:
        meaning: rfs:PeerOrCommunity
        description: Checked by peers or a community of practice.
      LAB_MEASURED:
        meaning: rfs:LabMeasured
        description: Established by laboratory measurement of samples.
      SENSOR_DERIVED:
        meaning: rfs:SensorDerived
        description: Derived from sensor or remote-sensing data.
      MODEL_ESTIMATED:
        meaning: rfs:ModelEstimated
        description: Estimated with a model.
      THIRD_PARTY_AUDITED:
        meaning: rfs:ThirdPartyAudited
        description: Reviewed by an independent third party, such as a verifier.
      OTHER:
        meaning: rfs:OtherVerificationMethod
        description: Not in this list; verificationMethodDescriptor says what it is.
