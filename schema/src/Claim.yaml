id: Claim
name: Claim
description: >-
  The reusable base Claim: asserted content shared by every kind of claim.
  Claim-type schemas extend it (is_a: Claim) with domain content such as
  impacts, quantities, methodologies or activities. Review state, anchoring
  state and identifiers derived from a Claim's own canonical form are not
  Claim content. See docs/claim-base.md.
prefixes:
  linkml: https://w3id.org/linkml/
  rfs: https://framework.regen.network/schema/
  rft: https://framework.regen.network/taxonomy/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/

imports:
  - linkml:types
  - core
  - taxonomy
  - Entity
  - ClaimSubject
  - ClaimVocabulary
  - ProvAlignment

default_prefix: rfs
default_range: string

classes:
  Claim:
    class_uri: rfs:Claim
    mixins:
      - ProvEntity
    description: >-
      An attributed assertion: related statements that one or more identified
      claimants present together about a subject, at a stated time. A Claim is
      asserted by definition, so it is self-attested by its claimants and is
      valid without any third-party attestation; later reviews are separate
      resources that point to it. An unasserted authoring candidate, such as
      an extraction draft without a claimant, is not a Claim. Every version is
      immutable: a correction is a new Claim that states wasRevisionOf.
    slots:
      - name
      - description
      - url
      - hasClaimType
      - hasClaimant
      - assertedAt
      - hasSubject
      - hasEvidence
      - wasRevisionOf
    slot_usage:
      name:
        required: true
        description: Human-readable title of the claim.
      description:
        description: >-
          The assertion as the claimant states it in natural language. This is
          asserted content, not a presentational summary: changing it changes
          the Claim.
      url:
        description: >-
          Link to a page with more information about the claim. A pointer for
          readers, not evidence; cite evidence with hasEvidence.
      wasRevisionOf:
        description: >-
          Identifier of the exact, immutable earlier Claim version that this
          Claim revises, typically its ClaimIRI. It never names a logical claim
          or version family. In PROV a revision implies that both versions are
          aspects of the same thing (alternateOf), so use it only for a revised
          version of the same assertion; a separate, later assertion, such as a
          follow-up observation, is a new Claim and is not a revision. The
          earlier version is unchanged, its attestations do not carry over, and
          selecting a current version happens outside the Claim.

slots:
  hasClaimType:
    slot_uri: rfs:hasClaimType
    description: >-
      Subject-matter classification of what is asserted, drawn from the
      ClaimType taxonomy. It classifies content only: it does not declare
      which schema or schema version the document conforms to, and it does
      not by itself select a verification pathway.
    range: ClaimType
    required: true
  hasClaimant:
    is_a: wasAttributedTo
    slot_uri: rfs:hasClaimant
    description: >-
      The agent or agents that take responsibility for making this
      assertion: an individual, organization or community. Each listed
      claimant takes responsibility for the whole assertion. A collective
      that asserts as one body is a single claimant of type COMMUNITY or
      ORGANIZATION; listing it does not make its members co-claimants. A
      service that extracted, generated or submitted the RDF is not a
      claimant unless it asserts the content itself. Specializes
      prov:wasAttributedTo, so under PROV each claimant is an agent associated
      with the activity that generated the Claim, which is the act of
      asserting. Unordered set.
    range: Entity
    required: true
    multivalued: true
    list_elements_ordered: false
    minimum_cardinality: 1
    inlined: true
    inlined_as_list: true
  assertedAt:
    slot_uri: rfs:assertedAt
    description: >-
      When the claimants make this assertion. It is the time of asserting,
      not the time of observation, extraction, file generation, submission,
      publication or ingestion. It is stated by the claimant and always known
      when asserting; the date of an earlier source document is cited
      evidence, not assertion time. The same content asserted at a different
      time is a different Claim. Written in UTC with whole seconds, in the
      XSD canonical form, for example 2026-05-02T07:30:00Z. A local offset is
      not accepted.
    range: datetime
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
    required: true
  hasSubject:
    slot_uri: rfs:hasSubject
    description: >-
      What the claim is about, as a ClaimSubject node identified by its IRI:
      a place, plot, project, organization, community, indicator, dataset or
      another claim. Claims about the same subject share its IRI and can be
      joined. Specialized claim schemas narrow the range to a subclass of
      ClaimSubject. Not the claimant, and not necessarily the feature of
      interest of an observation inside the claim.
    range: ClaimSubject
    inlined: true
    required: true
