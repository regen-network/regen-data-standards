on:
  push:
    branches:
      - main
  pull_request:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install python dependencies
        run: pip install -r requirements.txt
      - name: linkml lint
        run:  make -C schema lint
      - name: linkml gen-doc
        run: make -C schema gen-doc
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Publish
        # cloudflare/pages-action was deleted upstream (the repo 404s), so every
        # run has failed at job setup with "Unable to resolve action" since
        # July. wrangler-action is Cloudflare's supported replacement; `pages
        # deploy` on a non-main branch creates a preview deployment exactly as
        # pages-action did. Fork PRs never receive the secrets, so they skip
        # this step instead of failing on a missing token.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=regen-data-standards
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}